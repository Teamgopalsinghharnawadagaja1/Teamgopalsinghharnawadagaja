name: Build Team GopalSingh APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          set -e
          ZIP_NAME="team-gopal-singh-merged-app-android.zip"
          if [ -f "$ZIP_NAME" ]; then
            ZIP_FILE="$ZIP_NAME"
          else
            ZIP_FILE="$(find . -type f -iname "*.zip" -not -path "./.git/*" -print -quit || true)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP found."
            exit 1
          fi
          echo "ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -o "${{ steps.find_zip.outputs.zip_file }}" -d extracted
          find extracted -maxdepth 7 -type f | head -200

      - name: Find Android project
        id: gradle_project
        shell: bash
        run: |
          set -e
          GRADLE_DIR=""
          WRAPPER="$(find extracted -type f -name "gradlew" -print -quit || true)"
          if [ -n "$WRAPPER" ]; then
            GRADLE_DIR="$(dirname "$WRAPPER")"
          fi
          if [ -z "$GRADLE_DIR" ]; then
            SETTINGS="$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit || true)"
            if [ -n "$SETTINGS" ]; then
              GRADLE_DIR="$(dirname "$SETTINGS")"
            fi
          fi
          if [ -z "$GRADLE_DIR" ]; then
            echo "::error::No Gradle project found."
            exit 1
          fi
          echo "Gradle root: $GRADLE_DIR"
          echo "gradle_dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1
          exit 0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify environment
        shell: bash
        run: |
          java -version
          node --version
          npm --version
          echo "ANDROID_HOME: ${ANDROID_HOME:-not-set}"

      - name: Create local.properties
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > ${{ steps.gradle_project.outputs.gradle_dir }}/local.properties
          cat ${{ steps.gradle_project.outputs.gradle_dir }}/local.properties

      - name: Force Gradle 8.11.1
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          set -e
          PROPS="gradle/wrapper/gradle-wrapper.properties"
          NEW_URL="https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
          if [ -f "$PROPS" ]; then
            sed -i "s|distributionUrl=.*|distributionUrl=${NEW_URL}|" "$PROPS"
            cat "$PROPS"
          else
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: NPM Install
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          set -e
          PKG_FILES="$(find . -name "package.json" -not -path "*/node_modules/*" -not -path "*/.git/*" -print)"
          if [ -z "$PKG_FILES" ]; then
            echo "No package.json found — skipping."
            exit 0
          fi
          echo "$PKG_FILES" | while read PKG; do
            DIR="$(dirname "$PKG")"
            echo "npm install in: $DIR"
            cd "$DIR"
            npm install --legacy-peer-deps
            cd - > /dev/null
          done

      - name: NPM Build
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          CI: "false"
        run: |
          set -e
          PKG_FILES="$(find . -name "package.json" -not -path "*/node_modules/*" -not -path "*/.git/*" -print)"
          if [ -z "$PKG_FILES" ]; then
            echo "No package.json — skipping."
            exit 0
          fi
          echo "$PKG_FILES" | while read PKG; do
            DIR="$(dirname "$PKG")"
            HAS_BUILD="$(node -e "const p=require('$DIR/package.json');console.log(p.scripts&&p.scripts.build?'yes':'no')" 2>/dev/null || echo "no")"
            if [ "$HAS_BUILD" = "yes" ]; then
              echo "npm run build in: $DIR"
              cd "$DIR"
              npm run build
              cd - > /dev/null
            fi
          done

      - name: Build APK
        id: build_apk
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          CI: "false"
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Find APK
        id: apk
        if: success()
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          set -e
          APK="$(find . -type f -name "*.apk" -print | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::APK not found."
            exit 1
          fi
          echo "APK: $APK"
          du -h "$APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Prepare Final APK
        if: success()
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/final-apk"
          mkdir -p "$GITHUB_WORKSPACE/final-apk"
          cp "${{ steps.apk.outputs.apk_path }}" \
            "$GITHUB_WORKSPACE/final-apk/Team-GopalSingh-Debug.apk"
          ls -lh "$GITHUB_WORKSPACE/final-apk/Team-GopalSingh-Debug.apk"

      - name: Upload Team GopalSingh APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-Debug-APK
          path: final-apk/Team-GopalSingh-Debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-Build-Diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/**
          if-no-files-found: warn
          retention-days: 7

      - name: Build Successful
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "        BUILD SUCCESSFUL ✅"
          echo "APK      : Team-GopalSingh-Debug.apk"
          echo "Artifact : Team-GopalSingh-Debug-APK"
          echo "Location : Actions → Run → Artifacts"
          echo "========================================"
