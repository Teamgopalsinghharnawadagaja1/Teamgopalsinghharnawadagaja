name: Build Team GopalSingh APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_DIR: android
      CLIENT_DIR: client
      GRADLE_VERSION: "9.3.1"

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Setup Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 3. Setup Node.js 22
      # =========================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # =========================================================
      # 4. Setup Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================================================
      # 5. Install required Android SDK packages
      # =========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Installing Android SDK packages..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK installation complete."

      # =========================================================
      # 6. Setup Gradle 9.3.1
      # =========================================================
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # =========================================================
      # 7. Create diagnostic directory
      # =========================================================
      - name: Prepare diagnostics
        shell: bash
        run: |
          set -e
          mkdir -p build-logs
          mkdir -p apk-output

      # =========================================================
      # 8. Verify environment
      # =========================================================
      - name: Verify build environment
        shell: bash
        run: |
          set -o pipefail

          {
            echo "========================================"
            echo "JAVA"
            echo "========================================"
            java -version

            echo
            echo "========================================"
            echo "NODE"
            echo "========================================"
            node --version
            npm --version

            echo
            echo "========================================"
            echo "GRADLE"
            echo "========================================"
            gradle --version

            echo
            echo "========================================"
            echo "ANDROID SDK"
            echo "========================================"
            sdkmanager --list_installed

          } 2>&1 | tee build-logs/environment.log

      # =========================================================
      # 9. Validate project structure
      # =========================================================
      - name: Validate project structure
        shell: bash
        run: |
          set -e

          echo "Checking project structure..."

          test -d android
          test -d android/app
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts

          test -d client
          test -f client/package.json
          test -f client/vite.config.ts
          test -f client/index.html

          echo
          echo "Project structure:"
          echo "  android/                 OK"
          echo "  android/app/             OK"
          echo "  android/settings.gradle  OK"
          echo "  android/build.gradle     OK"
          echo "  client/                  OK"
          echo "  client/package.json      OK"
          echo "  client/vite.config.ts    OK"

      # =========================================================
      # 10. Show Gradle configuration
      # =========================================================
      - name: Inspect Gradle configuration
        shell: bash
        run: |
          {
            echo "========================================"
            echo "android/settings.gradle.kts"
            echo "========================================"
            cat android/settings.gradle.kts

            echo
            echo "========================================"
            echo "android/build.gradle.kts"
            echo "========================================"
            cat android/build.gradle.kts

            echo
            echo "========================================"
            echo "android/app/build.gradle.kts"
            echo "========================================"
            cat android/app/build.gradle.kts

          } 2>&1 | tee build-logs/gradle-configuration.log

      # =========================================================
      # 11. Install web dependencies
      # =========================================================
      - name: Install web dependencies
        working-directory: client
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "INSTALLING WEB DEPENDENCIES"
          echo "========================================"

          if [ -f package-lock.json ]; then
            echo "package-lock.json found"
            npm ci 2>&1 | tee ../build-logs/npm-install.log
          else
            echo "No package-lock.json found"
            echo "Using npm install"
            npm install 2>&1 | tee ../build-logs/npm-install.log
          fi

      # =========================================================
      # 12. Build web client
      # =========================================================
      - name: Build web client
        working-directory: client
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDING VITE WEB CLIENT"
          echo "========================================"

          npm run build \
            2>&1 | tee ../build-logs/npm-build.log

          echo
          echo "========================================"
          echo "WEB BUILD FILES"
          echo "========================================"

          test -d dist

          find dist \
            -type f \
            | sort \
            | tee ../build-logs/web-dist-files.log

      # =========================================================
      # 13. Copy web build into Android assets
      # =========================================================
      - name: Prepare Android web assets
        shell: bash
        run: |
          set -e

          WEB_ASSETS="android/app/src/main/assets/www"

          echo "Cleaning old Android web assets..."

          rm -rf "$WEB_ASSETS"

          mkdir -p "$WEB_ASSETS"

          echo "Copying client/dist..."

          cp -a client/dist/. "$WEB_ASSETS/"

          echo
          echo "Android assets created:"

          find "$WEB_ASSETS" \
            -type f \
            | sort \
            | tee build-logs/android-assets.log

      # =========================================================
      # 14. Create debug keystore
      # =========================================================
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="android/debug.keystore"

          rm -f "$KEYSTORE"

          echo "Creating debug keystore..."

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            2>&1 | tee build-logs/keystore.log

          test -f "$KEYSTORE"

          echo "Debug keystore created successfully."

      # =========================================================
      # 15. Check Gradle project
      # =========================================================
      - name: Check Gradle project
        working-directory: android
        shell: bash
        run: |
          set -o pipefail

          gradle tasks \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee ../build-logs/gradle-tasks.log

      # =========================================================
      # 16. Clean Android project
      # =========================================================
      - name: Clean Android project
        working-directory: android
        shell: bash
        run: |
          set -o pipefail

          gradle clean \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee ../build-logs/gradle-clean.log

      # =========================================================
      # 17. Build APK
      #
      # IMPORTANT:
      # copyWebAssets is skipped because the workflow has already
      # built client/dist and copied it into Android assets.
      #
      # This prevents npm from running twice.
      # =========================================================
      - name: Build Debug APK
        id: build_apk
        working-directory: android
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "STARTING ANDROID APK BUILD"
          echo "========================================"

          gradle :app:assembleDebug \
            -x copyWebAssets \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            --console=plain \
            2>&1 | tee ../build-logs/gradle-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo "$EXIT_CODE" > ../build-logs/gradle-exit-code.txt

          echo
          echo "========================================"
          echo "GRADLE EXIT CODE: $EXIT_CODE"
          echo "========================================"

          exit "$EXIT_CODE"

      # =========================================================
      # 18. Find generated APK
      # =========================================================
      - name: Locate APK
        if: always()
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find android \
            -type f \
            -name "*.apk" \
            -print \
            | tee build-logs/apk-files-found.log

          APK=$(find android \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo
            echo "NO APK WAS GENERATED."
            exit 0
          fi

          echo
          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" \
            apk-output/Team-GopalSingh-debug.apk

          echo
          echo "FINAL APK:"
          ls -lh apk-output/Team-GopalSingh-debug.apk

      # =========================================================
      # 19. Generate exact error summary
      # =========================================================
      - name: Generate exact error summary
        if: always()
        shell: bash
        run: |
          set +e

          SUMMARY="build-logs/exact-error-summary.txt"

          echo "========================================" > "$SUMMARY"
          echo "TEAM GOPAL SINGH APK BUILD DIAGNOSTICS" >> "$SUMMARY"
          echo "========================================" >> "$SUMMARY"
          echo >> "$SUMMARY"

          echo "DATE:" >> "$SUMMARY"
          date >> "$SUMMARY"

          echo >> "$SUMMARY"
          echo "========================================" >> "$SUMMARY"
          echo "GRADLE EXIT CODE" >> "$SUMMARY"
          echo "========================================" >> "$SUMMARY"

          if [ -f build-logs/gradle-exit-code.txt ]; then
            cat build-logs/gradle-exit-code.txt >> "$SUMMARY"
          else
            echo "Gradle build did not start or did not finish." >> "$SUMMARY"
          fi

          echo >> "$SUMMARY"
          echo "========================================" >> "$SUMMARY"
          echo "IMPORTANT ERRORS" >> "$SUMMARY"
          echo "========================================" >> "$SUMMARY"

          for LOG in \
            build-logs/npm-install.log \
            build-logs/npm-build.log \
            build-logs/gradle-tasks.log \
            build-logs/gradle-clean.log \
            build-logs/gradle-build.log
          do

            if [ -f "$LOG" ]; then

              echo >> "$SUMMARY"
              echo "----------- $LOG -----------" >> "$SUMMARY"

              grep -n -E \
                "FAILURE:|What went wrong:|Execution failed for task|Caused by:|AAPT2|Manifest merger failed|error:|ERROR|Exception|npm ERR!|TS[0-9]+" \
                "$LOG" \
                | tail -250 >> "$SUMMARY"

            fi

          done

          echo >> "$SUMMARY"
          echo "========================================" >> "$SUMMARY"
          echo "LAST 300 GRADLE LOG LINES" >> "$SUMMARY"
          echo "========================================" >> "$SUMMARY"

          if [ -f build-logs/gradle-build.log ]; then
            tail -300 build-logs/gradle-build.log >> "$SUMMARY"
          fi

          echo
          echo "========================================"
          echo "EXACT ERROR SUMMARY"
          echo "========================================"

          cat "$SUMMARY"

      # =========================================================
      # 20. Upload APK
      # =========================================================
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-APK
          path: apk-output/Team-GopalSingh-debug.apk
          if-no-files-found: warn
          retention-days: 30

      # =========================================================
      # 21. Upload complete diagnostics
      # =========================================================
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-Build-Diagnostics
          path: |
            build-logs/**
            android/**/build/reports/**
            android/**/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 30

      # =========================================================
      # 22. Final status
      # =========================================================
      - name: Final build status
        if: always()
        shell: bash
        run: |
          if [ -f build-logs/gradle-exit-code.txt ]; then

            EXIT_CODE=$(cat build-logs/gradle-exit-code.txt)

            if [ "$EXIT_CODE" != "0" ]; then

              echo "========================================"
              echo "APK BUILD FAILED"
              echo "========================================"

              echo
              echo "Open this artifact:"
              echo "Team-GopalSingh-Build-Diagnostics"

              echo
              echo "Main file:"
              echo "exact-error-summary.txt"

              exit "$EXIT_CODE"
            fi

          fi

          if [ ! -f apk-output/Team-GopalSingh-debug.apk ]; then

            echo "========================================"
            echo "APK NOT FOUND"
            echo "========================================"

            echo "Check:"
            echo "Team-GopalSingh-Build-Diagnostics"

            exit 1
          fi

          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh apk-output/Team-GopalSingh-debug.apk
