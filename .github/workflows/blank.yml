name: Build Team GopalSingh APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_DIR: android
      CLIENT_DIR: client
      GRADLE_VERSION: "9.3.1"

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 3. NODE 22
      # =========================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # =========================================================
      # 4. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # =========================================================
      # 5. GRADLE
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # =========================================================
      # 6. PREPARE LOG DIRECTORIES
      # =========================================================
      - name: Prepare diagnostics
        shell: bash
        run: |
          mkdir -p build-logs
          mkdir -p apk-output

      # =========================================================
      # 7. ENVIRONMENT
      # =========================================================
      - name: Print environment
        shell: bash
        run: |
          set -o pipefail

          {
            echo "========================================"
            echo "JAVA"
            echo "========================================"
            java -version

            echo
            echo "========================================"
            echo "NODE"
            echo "========================================"
            node --version
            npm --version

            echo
            echo "========================================"
            echo "GRADLE"
            echo "========================================"
            gradle --version

            echo
            echo "========================================"
            echo "ANDROID SDK"
            echo "========================================"
            sdkmanager --list_installed || true

          } 2>&1 | tee build-logs/environment.log

      # =========================================================
      # 8. FULL REPOSITORY DIAGNOSTICS
      # =========================================================
      - name: Inspect repository
        shell: bash
        run: |
          set +e

          {
            echo "========================================"
            echo "CURRENT DIRECTORY"
            echo "========================================"
            pwd

            echo
            echo "========================================"
            echo "TOP LEVEL"
            echo "========================================"
            ls -la

            echo
            echo "========================================"
            echo "ANDROID FILES"
            echo "========================================"
            if [ -d android ]; then
              find android -maxdepth 5 -type f | sort
            else
              echo "android directory NOT FOUND"
            fi

            echo
            echo "========================================"
            echo "CLIENT FILES"
            echo "========================================"
            if [ -d client ]; then
              find client -maxdepth 4 -type f | sort
            else
              echo "client directory NOT FOUND"
            fi

          } 2>&1 | tee build-logs/repository-structure.log

      # =========================================================
      # 9. SAFE PROJECT VALIDATION
      # =========================================================
      - name: Validate project structure
        id: validate
        shell: bash
        run: |
          set +e

          ERROR=0

          echo "========================================"
          echo "PROJECT VALIDATION"
          echo "========================================"

          echo
          echo "ANDROID PROJECT"
          echo "----------------------------------------"

          for FILE in \
            android/settings.gradle.kts \
            android/build.gradle.kts \
            android/app/build.gradle.kts
          do
            if [ -f "$FILE" ]; then
              echo "OK      $FILE"
            else
              echo "MISSING $FILE"
              ERROR=1
            fi
          done

          echo
          echo "CLIENT PROJECT"
          echo "----------------------------------------"

          if [ -d client ]; then
            echo "OK      client/"
          else
            echo "MISSING client/"
            ERROR=1
          fi

          if [ -f client/package.json ]; then
            echo "OK      client/package.json"
          else
            echo "MISSING client/package.json"
            ERROR=1
          fi

          echo
          echo "CLIENT CONFIGURATION"
          echo "----------------------------------------"

          find client \
            -maxdepth 2 \
            -type f \
            \
              -name "vite.config.*" \
              -o -name "webpack.config.*" \
              -o -name "next.config.*" \
              -o -name "index.html" \
              -o -name "package.json" \
            \
            2>/dev/null \
            | sort || true

          echo
          echo "========================================"

          if [ "$ERROR" -ne 0 ]; then
            echo "VALIDATION FAILED"
            echo "========================================"

            echo "1" > build-logs/validation-exit-code.txt
            exit 1
          fi

          echo "VALIDATION PASSED"
          echo "========================================"

          echo "0" > build-logs/validation-exit-code.txt

      # =========================================================
      # 10. INSPECT PACKAGE.JSON
      # =========================================================
      - name: Inspect client package
        if: success()
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CLIENT PACKAGE.JSON"
          echo "========================================"

          cat client/package.json \
            | tee build-logs/package-json.log

      # =========================================================
      # 11. INSTALL WEB DEPENDENCIES
      # =========================================================
      - name: Install web dependencies
        if: success()
        working-directory: client
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "INSTALLING WEB DEPENDENCIES"
          echo "========================================"

          if [ -f package-lock.json ]; then
            npm ci 2>&1 | tee ../build-logs/npm-install.log
          else
            npm install 2>&1 | tee ../build-logs/npm-install.log
          fi

      # =========================================================
      # 12. BUILD WEB CLIENT
      # =========================================================
      - name: Build web client
        if: success()
        working-directory: client
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDING WEB CLIENT"
          echo "========================================"

          npm run build \
            2>&1 | tee ../build-logs/npm-build.log

          echo
          echo "========================================"
          echo "CHECKING DIST"
          echo "========================================"

          if [ ! -d dist ]; then
            echo "ERROR: client/dist was not created."
            exit 1
          fi

          find dist \
            -type f \
            | sort \
            | tee ../build-logs/web-dist-files.log

      # =========================================================
      # 13. COPY WEB ASSETS
      # =========================================================
      - name: Prepare Android web assets
        if: success()
        shell: bash
        run: |
          set -e

          WEB_ASSETS="android/app/src/main/assets/www"

          echo "========================================"
          echo "PREPARING ANDROID WEB ASSETS"
          echo "========================================"

          rm -rf "$WEB_ASSETS"

          mkdir -p "$WEB_ASSETS"

          cp -a client/dist/. "$WEB_ASSETS/"

          echo
          echo "Android assets:"
          find "$WEB_ASSETS" \
            -type f \
            | sort \
            | tee build-logs/android-assets.log

      # =========================================================
      # 14. DEBUG KEYSTORE
      # =========================================================
      - name: Create debug keystore
        if: success()
        shell: bash
        run: |
          set -e

          KEYSTORE="android/debug.keystore"

          rm -f "$KEYSTORE"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            2>&1 | tee build-logs/keystore.log

          test -f "$KEYSTORE"

      # =========================================================
      # 15. GRADLE TASK LIST
      # =========================================================
      - name: Check Gradle project
        if: success()
        working-directory: android
        shell: bash
        run: |
          set -o pipefail

          gradle tasks \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee ../build-logs/gradle-tasks.log

      # =========================================================
      # 16. DETECT copyWebAssets TASK
      # =========================================================
      - name: Detect web asset Gradle task
        if: success()
        working-directory: android
        shell: bash
        run: |
          set +e

          gradle :app:tasks \
            --all \
            --no-daemon \
            --console=plain \
            > ../build-logs/app-tasks.log 2>&1

          if grep -q "copyWebAssets" ../build-logs/app-tasks.log; then
            echo "copyWebAssets task FOUND."
            echo "1" > ../build-logs/copy-web-assets-task.txt
          else
            echo "copyWebAssets task NOT FOUND."
            echo "0" > ../build-logs/copy-web-assets-task.txt
          fi

      # =========================================================
      # 17. GRADLE CLEAN
      # =========================================================
      - name: Gradle clean
        if: success()
        working-directory: android
        shell: bash
        run: |
          set -o pipefail

          gradle clean \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee ../build-logs/gradle-clean.log

      # =========================================================
      # 18. BUILD APK
      # =========================================================
      - name: Build Debug APK
        if: success()
        id: apk_build
        working-directory: android
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "STARTING APK BUILD"
          echo "========================================"

          GRADLE_ARGS=(
            ":app:assembleDebug"
            "--no-daemon"
            "--stacktrace"
            "--info"
            "--warning-mode"
            "all"
            "--console=plain"
          )

          if [ -f ../build-logs/copy-web-assets-task.txt ]; then
            if [ "$(cat ../build-logs/copy-web-assets-task.txt)" = "1" ]; then
              echo "Skipping copyWebAssets because web assets were already prepared."
              GRADLE_ARGS+=("-x" "copyWebAssets")
            fi
          fi

          echo
          echo "Gradle command:"
          printf 'gradle %q ' "${GRADLE_ARGS[@]}"
          echo
          echo

          gradle "${GRADLE_ARGS[@]}" \
            2>&1 | tee ../build-logs/gradle-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo "$EXIT_CODE" > ../build-logs/gradle-exit-code.txt

          echo
          echo "========================================"
          echo "GRADLE EXIT CODE: $EXIT_CODE"
          echo "========================================"

          exit "$EXIT_CODE"

      # =========================================================
      # 19. LOCATE APK
      # =========================================================
      - name: Locate APK
        if: always()
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find android \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \; \
            | tee build-logs
