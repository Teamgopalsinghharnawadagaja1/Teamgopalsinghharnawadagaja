name: Build Team GopalSingh APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Find ZIP
      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 3. Extract ZIP
      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir project

          unzip -q "$ZIP_FILE" -d project

          echo "Project extracted."

      # 4. Find Android project
      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found"
            find project -maxdepth 6 -type f | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 6. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 7. Install Android SDK 36
      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 8. Gradle 9.3.1
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # 9. Verify environment
      - name: Verify environment
        shell: bash
        run: |
          set -e

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== SDK ====="
          sdkmanager --list_installed | head -100

      # 10. Verify project
      - name: Verify project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/settings.gradle.kts" \
            || test -f "$PROJECT_DIR/settings.gradle"

          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -d "$PROJECT_DIR/app"

          echo "Android project OK."

      # 11. Create debug keystore
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="$PROJECT_DIR/debug.keystore"

          rm -f "$KEYSTORE"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f "$KEYSTORE"

          echo "Debug keystore ready."

      # 12. Check Google Services
      - name: Check Google Services
        shell: bash
        run: |
          GOOGLE=$(find "$PROJECT_DIR" \
            -name "google-services.json" \
            -type f \
            | head -n 1)

          if [ -n "$GOOGLE" ]; then
            echo "google-services.json found."
          else
            echo "google-services.json not found."
            echo "Continuing build."
          fi

      # 13. Clean
      - name: Clean
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace

      # 14. Build APK
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # 15. Locate APK
      - name: Locate APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          ls -lh "$APK"

      # 16. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
