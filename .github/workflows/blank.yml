name: Build Team GopalSingh APK (Diagnostics)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'android/**'
      - 'client/**'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '9.3.1'
  ANDROID_PLATFORM: 'android-36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  NODE_VERSION: '22'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Print build environment
        shell: bash
        run: |
          set -u
          echo '===== ENVIRONMENT ====='
          echo "Runner: $RUNNER_OS"
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Java:"
          java -version
          echo "Gradle:"
          gradle --version
          echo "Android SDK:"
          sdkmanager --list_installed 2>/dev/null | head -120 || true
          echo '======================='

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f client/package.json
          test -f client/index.html
          echo 'Project structure OK.'

      - name: Install web dependencies
        id: web_install
        working-directory: client
        shell: bash
        run: |
          set -o pipefail
          echo '===== WEB: npm install ====='
          npm install --no-audit --no-fund 2>&1 | tee ../web-npm-install.log
          status=${PIPESTATUS[0]}
          echo "npm install exit code: $status"
          exit "$status"

      - name: Build web client
        id: web_build
        working-directory: client
        shell: bash
        run: |
          set -o pipefail
          echo '===== WEB: npm run build ====='
          npm run build 2>&1 | tee ../web-build.log
          status=${PIPESTATUS[0]}
          echo "npm run build exit code: $status"
          if [ "$status" -ne 0 ]; then
            echo '===== WEB BUILD FAILED: useful files ====='
            find . -maxdepth 2 -type f | sort | head -300 || true
          fi
          exit "$status"

      - name: Prepare web assets for Android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -a client/dist/. android/app/src/main/assets/www/
          echo '===== WEB ASSETS ====='
          du -sh client/dist android/app/src/main/assets/www
          find android/app/src/main/assets/www -maxdepth 2 -type f | head -100

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail
          rm -f android/debug.keystore
          keytool -genkeypair -v \
            -keystore android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'
          test -f android/debug.keystore

      - name: Gradle clean
        id: gradle_clean
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          echo '===== GRADLE CLEAN ====='
          gradle clean --no-daemon --stacktrace --info --console=plain 2>&1 | tee ../gradle-clean.log
          status=${PIPESTATUS[0]}
          echo "gradle clean exit code: $status"
          exit "$status"

      - name: Build APK with full diagnostics
        id: gradle_build
        continue-on-error: true
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          echo '===== GRADLE APK BUILD START ====='
          echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Gradle: $(gradle --version | grep '^Gradle ' || true)"
          echo "Java: $(java -version 2>&1 | head -1)"
          echo '================================='

          # The web app is already built above. Skip the npm Gradle tasks so
          # the Android build has one clear, separately logged web-build step.
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            --warning-mode all \
            -x npmInstallClient \
            -x npmBuildClient \
            2>&1 | tee ../gradle-build.log

          status=${PIPESTATUS[0]}
          echo "GRADLE_BUILD_EXIT_CODE=$status" | tee ../gradle-build-exit-code.txt

          if [ "$status" -ne 0 ]; then
            echo ''
            echo '========== FIRST FAILURE HINTS =========='
            grep -n -E 'What went wrong:|Execution failed for task|Caused by:|FAILURE:|error:|ERROR:' ../gradle-build.log | tail -80 || true
            echo '========================================='
          fi

          exit "$status"

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics

          echo '===== JOB RESULT =====' > diagnostics/summary.txt
          echo "gradle_build=${{ steps.gradle_build.outcome }}" >> diagnostics/summary.txt
          echo "gradle_clean=${{ steps.gradle_clean.outcome }}" >> diagnostics/summary.txt
          echo "web_install=${{ steps.web_install.outcome }}" >> diagnostics/summary.txt
          echo "web_build=${{ steps.web_build.outcome }}" >> diagnostics/summary.txt
          echo "commit=${GITHUB_SHA}" >> diagnostics/summary.txt
          echo "ref=${GITHUB_REF}" >> diagnostics/summary.txt
          echo "run=${GITHUB_RUN_ID}" >> diagnostics/summary.txt

          cp -f web-npm-install.log diagnostics/ 2>/dev/null || true
          cp -f web-build.log diagnostics/ 2>/dev/null || true
          cp -f gradle-clean.log diagnostics/ 2>/dev/null || true
          cp -f gradle-build.log diagnostics/ 2>/dev/null || true
          cp -f gradle-build-exit-code.txt diagnostics/ 2>/dev/null || true

          echo '===== GRADLE FAILURE SUMMARY =====' > diagnostics/gradle-failure-summary.txt
          if [ -f gradle-build.log ]; then
            grep -n -E 'FAILURE:|What went wrong:|Execution failed for task|Caused by:|error:|ERROR:' gradle-build.log | tail -120 >> diagnostics/gradle-failure-summary.txt || true
          fi

          echo '===== GENERATED APK FILES =====' >> diagnostics/summary.txt
          find android -type f -name '*.apk' -print -exec ls -lh {} \; >> diagnostics/summary.txt 2>/dev/null || true

          echo '===== PROJECT FILE LIST =====' > diagnostics/project-files.txt
          find android client -maxdepth 5 -type f | sort | head -1000 >> diagnostics/project-files.txt 2>/dev/null || true

          echo '===== DIAGNOSTICS DIRECTORY ====='
          find diagnostics -maxdepth 2 -type f -print | sort

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-APK-${{ github.run_number }}
          path: |
            android/**/build/outputs/apk/**/*.apk
            android/**/build/outputs/apk/**/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-Build-Diagnostics-${{ github.run_number }}
          path: |
            diagnostics/**
            web-npm-install.log
            web-build.log
            gradle-clean.log
            gradle-build.log
            gradle-build-exit-code.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow if APK build failed
        if: steps.gradle_build.outcome == 'failure'
        shell: bash
        run: |
          echo '❌ APK build failed.'
          echo 'Open the Build Diagnostics artifact and inspect gradle-failure-summary.txt and gradle-build.log.'
          exit 1
