name: Build Team GopalSingh APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Find Project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f \
            \( -name "*.zip" -o -name "*.ZIP" \) \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found."
            find . -maxdepth 4 -type f -print
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Project
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.find_zip.outputs.zip_file }}" -d extracted

          echo "ZIP extracted."

      - name: Find Gradle Project
        id: gradle_project
        shell: bash
        run: |
          set -e

          echo "Searching Gradle project..."

          GRADLE_WRAPPER=$(find extracted \
            -type f \
            -name "gradlew" \
            -print -quit || true)

          if [ -n "$GRADLE_WRAPPER" ]; then

            GRADLE_DIR=$(dirname "$GRADLE_WRAPPER")
            echo "gradlew found: $GRADLE_WRAPPER"

          else

            SETTINGS_FILE=$(find extracted \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit || true)

            if [ -n "$SETTINGS_FILE" ]; then

              GRADLE_DIR=$(dirname "$SETTINGS_FILE")
              echo "settings file found: $SETTINGS_FILE"

            else

              BUILD_FILE=$(find extracted \
                -type f \
                \( -name "build.gradle" -o -name "build.gradle.kts" \) \
                -print -quit || true)

              if [ -z "$BUILD_FILE" ]; then
                echo "::error::No Gradle project found."

                echo "Files inside ZIP:"
                find extracted -maxdepth 7 -type f -print

                exit 1
              fi

              GRADLE_DIR=$(dirname "$BUILD_FILE")
              echo "build file found: $BUILD_FILE"

            fi
          fi

          echo "Gradle directory: $GRADLE_DIR"
          echo "gradle_dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        run: |
          java -version
          javac -version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then

            echo "Existing Gradle Wrapper found."
            chmod +x ./gradlew
            ./gradlew --version

          else

            echo "Gradle Wrapper not found."
            echo "Using installed Gradle to generate wrapper."

            gradle --version

            gradle wrapper --gradle-version 8.9

            chmod +x ./gradlew

            echo "Generated Gradle Wrapper:"
            ./gradlew --version

          fi

      - name: Check Android Project
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 5 -type f | head -250

          echo ""
          echo "Gradle files:"
          find . -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print

      - name: Build Debug APK
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          set -e
          set -o pipefail

          echo "========================================"
          echo "BUILDING TEAM GOPALSINGH APK"
          echo "========================================"

          chmod +x ./gradlew

          ./gradlew assembleDebug \
            --stacktrace \
            --info \
            --no-daemon

      - name: Find APK
        id: apk
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          set -e

          APK=$(find . \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."

            echo ""
            echo "Available APK/AAB files:"
            find . -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk_path=${{ steps.gradle_project.outputs.gradle_dir }}/$APK" \
            >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        run: |
          set -e

          mkdir -p final-apk

          cp "${{ steps.apk.outputs.apk_path }}" \
            "final-apk/Team-GopalSingh-Debug.apk"

          ls -lh final-apk/Team-GopalSingh-Debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-Debug-APK
          path: final-apk/Team-GopalSingh-Debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        if: success()
        run: |
          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "========================================"
          echo "Team-GopalSingh-Debug.apk"
          echo "Download it from Actions → Artifacts."
