name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Jhalrapatan Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "ERROR: android folder not found"
            exit 1
          fi

          if [ ! -f "android/settings.gradle.kts" ]; then
            echo "ERROR: android/settings.gradle.kts not found"
            exit 1
          fi

          if [ ! -f "android/build.gradle.kts" ]; then
            echo "ERROR: android/build.gradle.kts not found"
            exit 1
          fi

          if [ ! -f "android/app/build.gradle.kts" ]; then
            echo "ERROR: android/app/build.gradle.kts not found"
            exit 1
          fi

          echo "Android project structure OK"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install web dependencies
        working-directory: client
        run: npm ci

      - name: Build web app
        working-directory: client
        run: npm run build

      - name: Prepare Android web assets
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/assets

          rm -rf android/app/src/main/assets/dist

          cp -R client/dist android/app/src/main/assets/dist

          echo "Web assets copied successfully"

      - name: Prepare Gradle
        working-directory: android
        shell: bash
        run: |
          set -e

          if [ ! -f "gradlew" ]; then
            echo "Gradle wrapper missing. Generating wrapper..."

            gradle wrapper --gradle-version 9.3.1

            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      - name: Gradle version
        working-directory: android
        run: ./gradlew --version

      - name: Clean
        working-directory: android
        run: ./gradlew clean --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK generated successfully:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JHALRAPATAN-debug-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
