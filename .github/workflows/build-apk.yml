name: Build Team GopalSingh APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  CI: "false"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set +e
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" > /dev/null 2>&1
          exit 0

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-disabled: true

      - name: Create local.properties
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore android/debug.keystore \
            -alias androiddebugkey \
            -keypass android \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -v 2>/dev/null
          ls -lh android/debug.keystore

      - name: NPM Install
        working-directory: client
        shell: bash
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: NPM Build
        working-directory: client
        shell: bash
        run: |
          npm run build
          ls -la dist/

      - name: Copy web assets
        shell: bash
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r client/dist/. android/app/src/main/assets/www/
          ls -la android/app/src/main/assets/www | head -20

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          echo "========================================"
          echo "BUILDING TEAM GOPALSINGH APK"
          echo "========================================"
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Find APK
        id: apk
        if: success()
        working-directory: android
        shell: bash
        run: |
          set -e
          APK="$(find . -type f -name "*.apk" -print | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::APK not found."
            exit 1
          fi
          echo "APK: $APK"
          du -h "$APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Prepare Final APK
        if: success()
        shell: bash
        run: |
          mkdir -p final-apk
          cp "android/${{ steps.apk.outputs.apk_path }}" \
            "final-apk/Team-GopalSingh-Debug.apk"
          ls -lh final-apk/Team-GopalSingh-Debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-Debug-APK
          path: final-apk/Team-GopalSingh-Debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-Build-Diagnostics
          path: |
            android/build/reports/**
            android/app/build/reports/**
          if-no-files-found: warn
          retention-days: 7

      - name: Build Successful
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "      BUILD SUCCESSFUL ✅"
          echo "APK      : Team-GopalSingh-Debug.apk"
          echo "Artifact : Team-GopalSingh-Debug-APK"
          echo "Location : Actions → Run → Artifacts"
          echo "========================================"
