name: Build Team GopalSingh APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Extract project
        shell: bash
        run: |
          set -e

          unzip -q ./team-gopal-singh-merged-app-android.zip -d extracted

          rm -rf android client

          cp -a extracted/android android

          if [ -d extracted/client ]; then
            cp -a extracted/client client
          fi

          echo "Android project:"
          find android -maxdepth 3 -type f | sort

      - name: Install Gradle
        shell: bash
        run: |
          set -e

          curl -L --retry 3 \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
            -o gradle.zip

          unzip -q gradle.zip -d "$HOME"

          echo "$HOME/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Create debug keystore
        working-directory: android
        shell: bash
        run: |
          set -e

          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug \
            --no-daemon \
            --no-build-cache \
            --stacktrace \
            --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
