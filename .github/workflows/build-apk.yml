name: Build Team GopalSingh APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_DIR: android
      CLIENT_DIR: client

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PREPARE DIAGNOSTICS
      # ============================================================
      - name: Prepare diagnostics
        shell: bash
        run: |
          set -u

          mkdir -p build-logs
          mkdir -p apk-output

          {
            echo "========================================"
            echo "TEAM GOPAL SINGH APK BUILD"
            echo "========================================"
            echo "Date:"
            date
            echo
            echo "Repository:"
            pwd
            echo
            echo "Commit:"
            git rev-parse HEAD
          } | tee build-logs/start.log

      # ============================================================
      # 3. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 4. NODE 22
      # ============================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ============================================================
      # 5. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ============================================================
      # 6. SHOW REPOSITORY STRUCTURE
      # ============================================================
      - name: Inspect repository
        shell: bash
        run: |
          set +e

          {
            echo "========================================"
            echo "ROOT FILES"
            echo "========================================"

            find . \
              -maxdepth 3 \
              -type f \
              -not -path "./.git/*" \
              | sort

            echo
            echo "========================================"
            echo "ANDROID FILES"
            echo "========================================"

            find android \
              -maxdepth 6 \
              -type f \
              2>/dev/null \
              | sort

            echo
            echo "========================================"
            echo "CLIENT FILES"
            echo "========================================"

            find client \
              -maxdepth 4 \
              -type f \
              2>/dev/null \
              | sort

          } | tee build-logs/repository-structure.log

      # ============================================================
      # 7. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -u

          ERROR=0

          echo "========================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "========================================"

          if [ ! -d "$ANDROID_DIR" ]; then
            echo "::error::Android directory not found: $ANDROID_DIR"
            ERROR=1
          fi

          if [ ! -f "$ANDROID_DIR/settings.gradle" ] &&
             [ ! -f "$ANDROID_DIR/settings.gradle.kts" ]; then
            echo "::error::Android settings.gradle/settings.gradle.kts not found"
            ERROR=1
          fi

          if [ ! -f "$ANDROID_DIR/build.gradle" ] &&
             [ ! -f "$ANDROID_DIR/build.gradle.kts" ]; then
            echo "::error::Android build.gradle/build.gradle.kts not found"
            ERROR=1
          fi

          if [ ! -f "$ANDROID_DIR/app/build.gradle" ] &&
             [ ! -f "$ANDROID_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android app build.gradle/build.gradle.kts not found"
            ERROR=1
          fi

          if [ "$ERROR" -ne 0 ]; then
            echo
            echo "========================================"
            echo "ANDROID PROJECT VALIDATION FAILED"
            echo "========================================"
            echo
            echo "Repository structure is available in:"
            echo "build-logs/repository-structure.log"
            exit 1
          fi

          echo "Android project structure OK."

      # ============================================================
      # 8. DETECT GRADLE
      # ============================================================
      - name: Detect Gradle
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "DETECTING GRADLE"
          echo "========================================"

          if [ -f "$ANDROID_DIR/gradlew" ]; then
            echo "Gradle wrapper found."

            chmod +x "$ANDROID_DIR/gradlew"

            echo "GRADLE_COMMAND=$ANDROID_DIR/gradlew" >> "$GITHUB_ENV"
            echo "GRADLE_WORKING_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          elif [ -f "$ANDROID_DIR/gradlew.bat" ]; then
            echo "::error::gradlew.bat found but Linux gradlew is missing."
            exit 1

          else
            echo "Gradle wrapper not found."
            echo "Using GitHub-hosted Gradle installation."

            echo "GRADLE_COMMAND=gradle" >> "$GITHUB_ENV"
            echo "GRADLE_WORKING_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          fi

      # ============================================================
      # 9. INSTALL GRADLE ONLY IF WRAPPER IS ABSENT
      # ============================================================
      - name: Setup Gradle
        if: env.GRADLE_COMMAND == 'gradle'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # ============================================================
      # 10. PRINT ENVIRONMENT
      # ============================================================
      - name: Print environment
        shell: bash
        run: |
          set +e

          {
            echo "========================================"
            echo "JAVA"
            echo "========================================"
            java -version

            echo
            echo "========================================"
            echo "NODE"
            echo "========================================"
            node --version
            npm --version

            echo
            echo "========================================"
            echo "GRADLE"
            echo "========================================"
            "$GRADLE_COMMAND" --version

            echo
            echo "========================================"
            echo "ANDROID SDK"
            echo "========================================"
            sdkmanager --list_installed 2>/dev/null | head -100

          } 2>&1 | tee build-logs/environment.log

      # ============================================================
      # 11. INSPECT GRADLE FILES
      # ============================================================
      - name: Inspect Gradle configuration
        shell: bash
        run: |
          set +e

          {
            echo "========================================"
            echo "GRADLE FILES"
            echo "========================================"

            find "$ANDROID_DIR" \
              -maxdepth 4 \
              -type f \
              \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
                -o -name "build.gradle" \
                -o -name "build.gradle.kts" \
                -o -name "gradle.properties" \
              \
              -print

            echo
            echo "========================================"
            echo "SETTINGS"
            echo "========================================"

            if [ -f "$ANDROID_DIR/settings.gradle.kts" ]; then
              cat "$ANDROID_DIR/settings.gradle.kts"
            elif [ -f "$ANDROID_DIR/settings.gradle" ]; then
              cat "$ANDROID_DIR/settings.gradle"
            fi

            echo
            echo "========================================"
            echo "APP BUILD FILE"
            echo "========================================"

            if [ -f "$ANDROID_DIR/app/build.gradle.kts" ]; then
              cat "$ANDROID_DIR/app/build.gradle.kts"
            elif [ -f "$ANDROID_DIR/app/build.gradle" ]; then
              cat "$ANDROID_DIR/app/build.gradle"
            fi

          } | tee build-logs/gradle-configuration.log

      # ============================================================
      # 12. BUILD WEB CLIENT IF PRESENT
      # ============================================================
      - name: Build web client
        shell: bash
        run: |
          set -u

          if [ ! -
