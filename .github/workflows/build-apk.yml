name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          echo "ZIP: $ZIP"

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          echo "ZIP extracted successfully."

      - name: Detect correct project root
        shell: bash
        run: |
          set -e

          ROOT=""

          while IFS= read -r dir; do
            if [ -f "$dir/package.json" ] && [ -d "$dir/client" ] && [ -d "$dir/android" ]; then
              ROOT="$dir"
              break
            fi
          done < <(find extracted -type d)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Correct project root not found."
            echo "Required: package.json + client/ + android/"
            find extracted -maxdepth 5 -print
            exit 1
          fi

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "================================"
          echo "PROJECT ROOT:"
          echo "$ROOT"
          echo "================================"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies
        working-directory: ${{ env.ROOT }}
        run: npm install

      - name: Install client dependencies
        working-directory: ${{ env.ROOT }}/client
        run: npm install

      - name: Verify Vite
        working-directory: ${{ env.ROOT }}/client
        run: |
          if [ ! -x node_modules/.bin/vite ]; then
            echo "ERROR: Vite was not installed."
            exit 1
          fi

          ./node_modules/.bin/vite --version

      - name: Build web application
        working-directory: ${{ env.ROOT }}
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check Android project
        working-directory: ${{ env.ROOT }}/android
        run: |
          test -d app

          if [ ! -f gradlew ]; then
            echo "Gradle wrapper missing. Creating it..."
            gradle wrapper --gradle-version 9.3.1
          fi

          chmod +x gradlew

      - name: Check Gradle
        working-directory: ${{ env.ROOT }}/android
        run: ./gradlew --version

      - name: Build Debug APK
        working-directory: ${{ env.ROOT }}/android
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find "${ROOT}/android/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "================================"
          echo "APK BUILD SUCCESSFUL"
          echo "$APK"
          echo "================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JHALRAPATAN-APK
          path: ${{ env.ROOT }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
