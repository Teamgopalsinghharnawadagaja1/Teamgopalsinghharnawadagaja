name: Build Team GopalSingh APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Build APK
        shell: bash
        run: |
          set -e

          if [ -f "android/gradlew" ]; then
            cd android
          elif [ -f "gradlew" ]; then
            :
          else
            echo "ERROR: Gradle project not found"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          chmod +x gradlew

          ./gradlew clean assembleDebug \
            --no-daemon \
            --no-build-cache \
            --stacktrace \
            --console=plain

      - name: Find APK
        shell: bash
        run: |
          set -e
          mkdir -p apk-output

          APK=$(find . \
            -path "*/build/outputs/apk/debug/*.apk" \
            -type f \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" apk-output/Team-GopalSingh-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-debug-APK
          path: apk-output/Team-GopalSingh-debug.apk
          if-no-files-found: error
