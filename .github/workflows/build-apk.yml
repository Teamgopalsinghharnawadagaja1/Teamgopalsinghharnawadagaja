name: Build Team GopalSingh APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_DIR: android
      CLIENT_DIR: client
      JAVA_VERSION: "17"
      NODE_VERSION: "20"
      ANDROID_API: "35"
      BUILD_TOOLS: "35.0.0"

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. PREPARE DIRECTORIES
      # =========================================================
      - name: Prepare build directories
        shell: bash
        run: |
          set -e

          mkdir -p build-logs
          mkdir -p apk-output

          echo "========================================"
          echo "TEAM GOPALSINGH APK BUILD"
          echo "========================================"
          echo "Build date:"
          date
          echo
          echo "Workspace:"
          pwd

      # =========================================================
      # 3. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 4. NODE 20
      # =========================================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # =========================================================
      # 5. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          set -o pipefail

          {
            echo "========================================"
            echo "ANDROID SDK SETUP"
            echo "========================================"

            echo "Accepting Android SDK licenses..."

            yes | sdkmanager --licenses >/dev/null 2>&1 || true

            echo
            echo "Installing required packages..."

            sdkmanager \
              "platform-tools" \
              "platforms;android-${ANDROID_API}" \
              "build-tools;${BUILD_TOOLS}"

            echo
            echo "Installed Android packages:"
            sdkmanager --list_installed 2>/dev/null | head -150 || true

          } 2>&1 | tee build-logs/android-sdk.log

      # =========================================================
      # 6. INSPECT REPOSITORY
      # =========================================================
      - name: Inspect repository
        shell: bash
        run: |
          set -e

          {
            echo "========================================"
            echo "REPOSITORY FILES"
            echo "========================================"

            find . \
              -maxdepth 4 \
              -type f \
              ! -path "./.git/*" \
              | sort

            echo
            echo "========================================"
            echo "REPOSITORY DIRECTORIES"
            echo "========================================"

            find . \
              -maxdepth 4 \
              -type d \
              ! -path "./.git*" \
              | sort

          } 2>&1 | tee build-logs/repository.log

      # =========================================================
      # 7. FIND / EXTRACT ANDROID ZIP
      # =========================================================
      - name: Extract Android project ZIP if required
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID PROJECT DETECTION"
          echo "========================================"

          # -------------------------------------------------------
          # If android/ already exists, do nothing.
          # -------------------------------------------------------
          if [ -d "android" ]; then
            echo "android/ directory already exists."
            echo "ZIP extraction is not required."
            exit 0
          fi

          echo "android/ directory was not found."
          echo "Searching for ZIP archive..."

          # IMPORTANT:
          # Correct Bash syntax is:
          # -iname "*.zip"
          # -------------------------------------------------------

          ZIP_FILE="$(
            find . \
              -maxdepth 4 \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              | head -n 1
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo
            echo "ERROR: No android/ directory and no ZIP archive found."
            echo
            echo "Repository contents:"
            find . \
              -maxdepth 5 \
              -type f \
              ! -path "./.git/*" \
              | sort
            exit 1
          fi

          echo
          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          # -------------------------------------------------------
          # Extract ZIP
          # -------------------------------------------------------

          rm -rf extracted-project
          mkdir -p extracted-project

          echo
          echo "Extracting ZIP..."

          unzip -q "$ZIP_FILE" -d extracted-project

          echo "ZIP extraction completed."

          # -------------------------------------------------------
          # Find Android directory
          # -------------------------------------------------------

          echo
          echo "Searching extracted files for android/..."

          FOUND_ANDROID="$(
            find extracted-project \
              -type d \
              -name "android" \
              | head -n 1
          )"

          if [ -z "$FOUND_ANDROID" ]; then

            echo
            echo "ERROR: android/ directory was not found inside ZIP."

            echo
            echo "Extracted directory tree:"
            find extracted-project \
              -maxdepth 6 \
              -type d \
              | sort

            echo
            echo "Extracted files:"
            find extracted-project \
              -maxdepth 6 \
              -type f \
              | sort

            exit 1
          fi

          echo
          echo "ANDROID DIRECTORY FOUND:"
          echo "$FOUND_ANDROID"

          # -------------------------------------------------------
          # Determine project root
          # Example:
          # extracted-project/team-gopal-singh/android
          #
          # PROJECT_ROOT becomes:
          # extracted-project/team-gopal-singh
          # -------------------------------------------------------

          PROJECT_ROOT="$(dirname "$FOUND_ANDROID")"

          echo
          echo "PROJECT ROOT:"
          echo "$PROJECT_ROOT"

          # -------------------------------------------------------
          # Copy Android project
          # -------------------------------------------------------

          cp -a "$FOUND_ANDROID" "./android"

          echo
          echo "Android project copied."

          # -------------------------------------------------------
          # Copy client project if it exists
          # -------------------------------------------------------

          if [ -d "$PROJECT_ROOT/client" ]; then

            cp -a "$PROJECT_ROOT/client" "./client"

            echo "client/ directory copied."

          else

            echo "No client/ directory found."
            echo "Android-only build will be attempted."

          fi

          # -------------------------------------------------------
          # Final structure
          # -------------------------------------------------------

          echo
          echo "========================================"
          echo "FINAL PROJECT STRUCTURE"
          echo "========================================"

          find . \
            -maxdepth 5 \
            -type d \
            ! -path "./.git*" \
            | sort

      # =========================================================
      # 8. VERIFY ANDROID PROJECT
      # =========================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFY ANDROID PROJECT"
          echo "========================================"

          if [ ! -d "android" ]; then
            echo "ERROR: android/ directory is missing."
            exit 1
          fi

          if [ ! -d "android/app" ]; then
            echo "ERROR: android/app directory is missing."
            exit 1
          fi

          # -------------------------------------------------------
          # settings.gradle
          # -------------------------------------------------------

          if [ -f "android/settings.gradle.kts" ]; then

            echo "FOUND: android/settings.gradle.kts"

          elif [ -f "android/settings.gradle" ]; then

            echo "FOUND: android/settings.gradle"

          else

            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            exit 1

          fi

          # -------------------------------------------------------
          # app/build.gradle
          # -------------------------------------------------------

          if [ -f "android/app/build.gradle.kts" ]; then

            echo "FOUND: android/app/build.gradle.kts"

          elif [ -f "android/app/build.gradle" ]; then

            echo "FOUND: android/app/build.gradle"

          else

            echo "ERROR: android/app/build.gradle(.kts) not found."
            exit 1

          fi

          # -------------------------------------------------------
          # AndroidManifest
          # -------------------------------------------------------

          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then

            echo "FOUND: AndroidManifest.xml"

          else

            echo "WARNING: AndroidManifest.xml not found at standard location."

          fi

          echo
          echo "Android project validation passed."

          echo
          echo "Android project files:"

          find android \
            -maxdepth 6 \
            -type f \
            | sort \
            | tee build-logs/android-project.log

      # =========================================================
      # 9. VERIFY CLIENT
      # =========================================================
      - name: Verify client project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFY CLIENT PROJECT"
          echo "========================================"

          if [ ! -d "client" ]; then

            echo "client/ directory not found."
            echo "Android-only build will continue."
            exit 0

          fi

          if [ ! -f "client/package.json" ]; then

            echo "client/package.json not found."
            echo "Android-only build will continue."
            exit 0

          fi

          echo "Client project found."

          echo
          echo "package.json:"
          cat client/package.json

      # =========================================================
      # 10. INSTALL WEB DEPENDENCIES
      # =========================================================
      - name: Install web dependencies
        if: ${{ hashFiles('client/package.json') != '' }}
        working-directory: client
        shell: bash
        run: |
          set -e
          set -o pipefail

          mkdir -p ../build-logs

          {
            echo "========================================"
            echo "INSTALL WEB DEPENDENCIES"
            echo "========================================"

            if [ -f "package-lock.json" ]; then

              echo "package-lock.json found."
              echo "Running npm ci..."

              npm ci

            else

              echo "package-lock.json not found."
              echo "Running npm install..."

              npm install

            fi

            echo
            echo "Node version:"
            node --version

            echo "NPM version:"
            npm --version

          } 2>&1 | tee ../build-logs/npm-install.log

      # =========================================================
      # 11. BUILD WEB CLIENT
      # =========================================================
      - name: Build web client
        if: ${{ hashFiles('client/package.json') != '' }}
        working-directory: client
        shell: bash
        run: |
          set -e
          set -o pipefail

          {
            echo "========================================"
            echo "BUILD WEB CLIENT"
            echo "========================================"

            npm run build

            echo
            echo "Checking web build output..."

            # Support common web output directories.
            if [ -d "dist" ]; then

              WEB_OUTPUT="dist"

            elif [ -d "build" ]; then

              WEB_OUTPUT="build"

            else

              echo "ERROR: Neither dist/ nor build/ was created."
              echo
              echo "Client files:"
              find . \
                -maxdepth 4 \
                -type f \
                | sort

              exit 1

            fi

            echo
            echo "Web output directory:"
            echo "$WEB_OUTPUT"

            echo
            echo "Web build files:"
            find "$WEB_OUTPUT" \
              -type f \
              | sort

            echo "$WEB_OUTPUT" > ../build-logs/web-output-dir.txt

          } 2>&1 | tee ../build-logs/npm-build.log

      # =========================================================
      # 12. COPY WEB ASSETS INTO ANDROID
      # =========================================================
      - name: Prepare Android web assets
        if: ${{ hashFiles('client/package.json') != '' }}
        shell: bash
        run: |
          set -e

          if [ ! -f "build-logs/web-output-dir.txt" ]; then
            echo "ERROR: Web output directory information is missing."
            exit 1
          fi

          WEB_OUTPUT="$(cat build-logs/web-output-dir.txt)"

          if [ ! -d "client/$WEB_OUTPUT" ]; then
            echo "ERROR: client/$WEB_OUTPUT does not exist."
            exit 1
          fi

          WEB_ASSETS="android/app/src/main/assets/www"

          rm -rf "$WEB_ASSETS"
          mkdir -p "$WEB_ASSETS"

          cp -a "client/$WEB_OUTPUT/." "$WEB_ASSETS/"

          echo "========================================"
          echo "ANDROID WEB ASSETS"
          echo "========================================"

          find "$WEB_ASSETS" \
            -type f \
            | sort \
            | tee build-logs/android-assets.log

      # =========================================================
      # 13. CREATE DEBUG KEYSTORE
      # =========================================================
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="android/debug.keystore"

          if [ -f "$KEYSTORE" ]; then

            echo "Debug keystore already exists."

          else

            echo "Creating debug keystore..."

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              2>&1 \
              | tee build-logs/keystore.log

            echo "Debug keystore created."

          fi

      # =========================================================
      # 14. SETUP GRADLE
      # =========================================================
      - name: Setup Gradle
        shell: bash
        run: |
          set -e
          set -o pipefail

          echo "========================================"
          echo "GRADLE SETUP"
          echo "========================================"

          if [ -f "android/gradlew" ]; then

            echo "Gradle Wrapper FOUND."

            chmod +x android/gradlew

            cd android

            ./gradlew --version \
              2>&1 \
              | tee ../build-logs/gradle-version.log

          else

            echo "Gradle Wrapper NOT FOUND."
            echo "Installing Gradle 8.13..."

            GRADLE_VERSION="8.13"
            GRADLE_HOME="$HOME/gradle"

            rm -rf "$GRADLE_HOME"
            mkdir -p "$GRADLE_HOME"

            curl -fsSL \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o gradle.zip

            unzip -q gradle.zip -d "$GRADLE_HOME"

            GRADLE_BIN="$GRADLE_HOME/gradle-${GRADLE_VERSION}/bin"

            echo "$GRADLE_BIN" >> "$GITHUB_PATH"

            export PATH="$GRADLE_BIN:$PATH"

            gradle --version \
              2>&1 \
              | tee build-logs/gradle-version.log

          fi

      # =========================================================
      # 15. PRINT ENVIRONMENT
      # =========================================================
      - name: Print build environment
        shell: bash
        run: |
          set -e

          {
            echo "========================================"
            echo "BUILD ENVIRONMENT"
            echo "========================================"

            echo
            echo "Java:"
            java -version

            echo
            echo "Node:"
            node --version

            echo
            echo "NPM:"
            npm --version

            echo
            echo "ANDROID_HOME:"
            echo "${ANDROID_HOME:-not-set}"

            echo
            echo "JAVA_HOME:"
            echo "${JAVA_HOME:-not-set}"

            echo
            echo "Gradle:"
            if [ -f "android/gradlew" ]; then
              cd android
              ./gradlew --version
            else
              gradle --version
            fi

          } 2>&1 | tee build-logs/environment.log

      # =========================================================
      # 16. CHECK GRADLE PROJECT
      # =========================================================
      - name: Check Gradle project
        working-directory: android
        shell: bash
        run: |
          set -e
          set -o pipefail

          if [ -f "./gradlew" ]; then

            GRADLE="./gradlew"

          else

            GRADLE="gradle"

          fi

          echo "Using Gradle:"
          echo "$GRADLE"

          "$GRADLE" tasks \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 \
            | tee ../build-logs/gradle-tasks.log

      # =========================================================
      # 17. CLEAN ANDROID PROJECT
      # =========================================================
      - name: Clean Android project
        working-directory: android
        shell: bash
        run: |
          set -e
          set -o pipefail

          if [ -f "./gradlew" ]; then

            GRADLE="./gradlew"

          else

            GRADLE="gradle"

          fi

          echo "Cleaning Android project..."

          "$GRADLE" clean \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 \
            | tee ../build-logs/gradle-clean.log

      # =========================================================
      # 18. BUILD DEBUG APK
      # =========================================================
      - name: Build Debug APK
        id: build_apk
        working-directory: android
        shell: bash
        run: |
          set +e

          mkdir -p ../build-logs

          if [ -f "./gradlew" ]; then

            GRADLE="./gradlew"

          else

            GRADLE="gradle"

          fi

          echo "========================================"
          echo "BUILDING DEBUG APK"
          echo "========================================"

          "$GRADLE" :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            --console=plain \
            2>&1 \
            | tee ../build-logs/gradle-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo "$EXIT_CODE" \
            > ../build-logs/gradle-exit-code.txt

          echo
          echo "Gradle exit code:"
          echo "$EXIT_CODE"

          exit "$EXIT_CODE"

      # =========================================================
      # 19. LOCATE APK
      # =========================================================
      - name: Locate APK
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p apk-output

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          APK_LIST="build-logs/apk-files.log"

          find android \
            -type f \
            -name "*.apk" \
            -print \
            | sort \
            | tee "$APK_LIST"

          APK="$(
            find android \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/apk/*/*.apk" \
              | sort \
              | head -n 1
          )"

          if [ -n "$APK" ]; then

            echo
            echo "========================================"
            echo "APK FOUND"
            echo "========================================"

            echo "$APK"

            cp "$APK" \
              "apk-output/Team-GopalSingh-debug.apk"

            echo
            echo "Final APK:"
            ls -lh \
              "apk-output/Team-GopalSingh-debug.apk"

          else

            echo
            echo "========================================"
            echo "APK NOT FOUND"
            echo "========================================"

          fi

      # =========================================================
      # 20. GENERATE ERROR SUMMARY
      # =========================================================
      - name: Generate error summary
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p build-logs

          SUMMARY="build-logs/exact-error-summary.txt"

          {
            echo "========================================"
            echo "TEAM GOPALSINGH BUILD DIAGNOSTICS"
            echo "========================================"

            echo
            echo "Date:"
            date

            echo
            echo "========================================"
            echo "GRADLE EXIT CODE"
            echo "========================================"

            if [ -f "build-logs/gradle-exit-code.txt" ]; then

              cat "build-logs/gradle-exit-code.txt"

            else

              echo "Gradle build did not start."

            fi

            echo
            echo "========================================"
            echo "APK FILES"
            echo "========================================"

            if [ -f "build-logs/apk-files.log" ]; then

              cat "build-logs/apk-files.log"

            else

              echo "APK search log not available."

            fi

            echo
            echo "========================================"
            echo "IMPORTANT ERRORS"
            echo "========================================"

            for LOG in \
              build-logs/gradle-build.log \
              build-logs/gradle-clean.log \
              build-logs/gradle-tasks.log \
              build-logs/npm-build.log \
              build-logs/npm-install.log
            do

              if [ -f "$LOG" ]; then

                echo
                echo "----------- $LOG -----------"

                grep -n -E \
                  "FAILURE:|What went wrong:|Execution failed|Caused by:|AAPT2|Manifest merger failed|error:|ERROR|Exception|npm ERR!|Could not resolve|Could not find|Unsupported" \
                  "$LOG" \
                  | tail -250 \
                  || true

              fi

            done

            echo
            echo "========================================"
            echo "LAST 300 GRADLE BUILD LOG LINES"
            echo "========================================"

            if [ -f "build-logs/gradle-build.log" ]; then

              tail -300 "build-logs/gradle-build.log"

            fi

          } > "$SUMMARY"

          cat "$SUMMARY"

      # =========================================================
      # 21. UPLOAD APK
      # =========================================================
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-APK
          path: apk-output/Team-GopalSingh-debug.apk
          if-no-files-found: warn
          retention-days:
