name: Build Team GopalSingh APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Team GopalSingh APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. FIND MAIN ZIP
      # ============================================================
      - name: Find Main Project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_NAME="team-gopal-singh-merged-app-android.zip"

          echo "Searching for:"
          echo "$ZIP_NAME"

          if [ -f "$ZIP_NAME" ]; then
            ZIP_FILE="$ZIP_NAME"
          else
            ZIP_FILE=$(find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              -print -quit || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No project ZIP found."

            echo "Available files:"
            find . -maxdepth 4 -type f -print

            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 3. EXTRACT ZIP
      # ============================================================
      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o \
            "${{ steps.find_zip.outputs.zip_file }}" \
            -d extracted

          echo "ZIP extracted successfully."

          echo ""
          echo "Extracted project:"
          find extracted -maxdepth 6 -type f -print | head -300

      # ============================================================
      # 4. FIND REAL GRADLE ROOT
      # ============================================================
      - name: Find Gradle Project
        id: gradle_project
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle project..."

          GRADLE_DIR=""

          # First priority: gradlew
          WRAPPER=$(find extracted \
            -type f \
            -name "gradlew" \
            -print -quit || true)

          if [ -n "$WRAPPER" ]; then

            GRADLE_DIR=$(dirname "$WRAPPER")

            echo "Found Gradle Wrapper:"
            echo "$WRAPPER"

          fi

          # Second priority: settings.gradle
          if [ -z "$GRADLE_DIR" ]; then

            SETTINGS=$(find extracted \
              -type f \
              \( \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
              \) \
              -print -quit || true)

            if [ -n "$SETTINGS" ]; then

              GRADLE_DIR=$(dirname "$SETTINGS")

              echo "Found settings file:"
              echo "$SETTINGS"

            fi

          fi

          # Third priority: build.gradle
          if [ -z "$GRADLE_DIR" ]; then

            BUILD=$(find extracted \
              -type f \
              \( \
                -name "build.gradle" \
                -o -name "build.gradle.kts" \
              \) \
              -print -quit || true)

            if [ -n "$BUILD" ]; then

              GRADLE_DIR=$(dirname "$BUILD")

              echo "Found build file:"
              echo "$BUILD"

            fi

          fi

          if [ -z "$GRADLE_DIR" ]; then

            echo "::error::No Gradle project found inside ZIP."

            echo ""
            echo "ZIP CONTENT:"
            find extracted -maxdepth 10 -type f -print

            exit 1

          fi

          echo ""
          echo "Gradle root:"
          echo "$GRADLE_DIR"

          echo "gradle_dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 6. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # 7. SETUP GRADLE
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # ============================================================
      # 8. PREPARE PROJECT
      # ============================================================
      - name: Prepare Gradle
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          set -e

          echo "Preparing Gradle..."

          if [ -f "./gradlew" ]; then

            echo "Existing Gradle Wrapper found."

            chmod +x ./gradlew

          else

            echo "Gradle Wrapper does not exist."

            echo "Generating wrapper using installed Gradle."

            gradle wrapper

            chmod +x ./gradlew

          fi

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      # ============================================================
      # 9. SHOW PROJECT INFORMATION
      # ============================================================
      - name: Inspect Project
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          echo "========================================"
          echo "PROJECT INFORMATION"
          echo "========================================"

          echo ""
          echo "Project root:"
          pwd

          echo ""
          echo "Gradle files:"
          find . -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) \
            -print

          echo ""
          echo "Android manifests:"
          find . \
            -type f \
            -name "AndroidManifest.xml" \
            -print

          echo ""
          echo "Gradle wrapper:"
          ls -la gradlew 2>/dev/null || true

      # ============================================================
      # 10. BUILD APK DIRECTLY
      # ============================================================
      - name: Build Debug APK
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          set -e
          set -o pipefail

          echo "========================================"
          echo "BUILDING TEAM GOPALSINGH APK"
          echo "========================================"

          chmod +x ./gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 11. FIND APK
      # ============================================================
      - name: Find APK
        id: apk
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK=$(find . \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "::error::APK was not generated."

            echo ""
            echo "Searching all build outputs:"

            find . \
              -type f \
              \( \
                -name "*.apk" \
                -o -name "*.aab" \
              \) \
              -print || true

            echo ""
            echo "Build directories:"

            find . \
              -type d \
              -name "build" \
              -print || true

            exit 1

          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          echo ""
          echo "APK SIZE:"
          du -h "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 12. COPY APK
      # ============================================================
      - name: Prepare Final APK
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/final-apk"

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp \
            "${{ steps.apk.outputs.apk_path }}" \
            "$GITHUB_WORKSPACE/final-apk/Team-GopalSingh-Debug.apk"

          echo ""
          echo "Final APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/final-apk/Team-GopalSingh-Debug.apk"

      # ============================================================
      # 13. UPLOAD APK
      # ============================================================
      - name: Upload Team GopalSingh APK
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-Debug-APK
          path: final-apk/Team-GopalSingh-Debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 14. SUCCESS
      # ============================================================
      - name: Build Successful
        if: success()
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "========================================"
          echo ""
          echo "APK:"
          echo "Team-GopalSingh-Debug.apk"
          echo ""
          echo "Artifact:"
          echo "Team-GopalSingh-Debug-APK"
          echo ""
          echo "Go to GitHub:"
          echo "Actions -> Successful Run -> Artifacts"
          echo ""
          echo "========================================"
