name: Build Team GopalSingh APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v5

      # 2. Find ZIP
      - name: Find Project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          echo "Searching for project ZIP..."

          ZIP_FILE=$(find . -type f \
            \( -name "*.zip" -o -name "*.ZIP" \) \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found in repository."
            echo "Repository files:"
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # 3. Extract ZIP
      - name: Extract Project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.find_zip.outputs.zip_file }}" -d extracted

          echo "Project extracted successfully."

          echo "Top-level files:"
          find extracted -maxdepth 3 -type f | head -150

      # 4. Find Gradle project
      - name: Find Gradle Project
        id: gradle_project
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle wrapper..."

          GRADLE_WRAPPER=$(find extracted \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -z "$GRADLE_WRAPPER" ]; then
            echo "::error::gradlew not found."

            echo "Searching for Gradle files..."
            find extracted -type f \
              \( -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \) \
              -print

            exit 1
          fi

          GRADLE_DIR=$(dirname "$GRADLE_WRAPPER")

          echo "Gradle wrapper:"
          echo "$GRADLE_WRAPPER"

          echo "Gradle project directory:"
          echo "$GRADLE_DIR"

          echo "gradle_dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"

      # 5. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 6. Verify Java
      - name: Verify Java
        run: |
          java -version
          javac -version

      # 7. Setup Android
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 8. Show Android environment
      - name: Check Android Environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -n "$ANDROID_HOME" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list | head -50 || true
          fi

      # 9. Make Gradle executable
      - name: Make Gradle Wrapper Executable
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        run: |
          chmod +x gradlew
          ls -la gradlew

      # 10. Check Gradle
      - name: Check Gradle
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          ./gradlew --version

      # 11. Build APK
      - name: Build Debug APK
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          set -o pipefail

          echo "Starting Gradle APK build..."

          ./gradlew assembleDebug \
            --stacktrace \
            --info \
            --no-daemon

      # 12. Find APK
      - name: Find Generated APK
        id: apk
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find "${{ steps.gradle_project.outputs.gradle_dir }}" \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."

            echo "Searching for build outputs..."
            find "${{ steps.gradle_project.outputs.gradle_dir }}" \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            exit 1
          fi

          echo "APK successfully generated:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # 13. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-Debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
