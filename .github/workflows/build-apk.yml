name: Build Team GopalSingh APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "android" ]; then
            echo "android/ already exists."
            exit 0
          fi

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          ANDROID_DIR="$(find extracted -type d -name android | head -n 1)"

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: android/ directory not found inside ZIP."
            find extracted -maxdepth 5 -type d
            exit 1
          fi

          echo "Found Android project: $ANDROID_DIR"

          cp -a "$ANDROID_DIR" ./android

          PROJECT_ROOT="$(dirname "$ANDROID_DIR")"

          if [ -d "$PROJECT_ROOT/client" ]; then
            cp -a "$PROJECT_ROOT/client" ./client
            echo "client/ copied."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        working-directory: android
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        working-directory: android
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
