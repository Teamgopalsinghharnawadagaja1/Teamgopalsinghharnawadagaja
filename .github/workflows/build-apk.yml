name: Build Team GopalSingh APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Team GopalSingh APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v6

      # ============================================================
      # 2. FIND PROJECT ZIP
      # ============================================================
      - name: Find Project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_NAME="team-gopal-singh-merged-app-android.zip"

          echo "========================================"
          echo "SEARCHING PROJECT ZIP"
          echo "========================================"

          if [ -f "$ZIP_NAME" ]; then
            ZIP_FILE="$ZIP_NAME"
          else
            ZIP_FILE="$(find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              -print -quit || true)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No project ZIP found."

            echo ""
            echo "Available ZIP files:"
            find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              -print || true

            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 3. EXTRACT ZIP
      # ============================================================
      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXTRACTING PROJECT"
          echo "========================================"

          rm -rf extracted
          mkdir -p extracted

          unzip -o \
            "${{ steps.find_zip.outputs.zip_file }}" \
            -d extracted

          echo ""
          echo "Extraction completed."

          echo ""
          echo "Extracted project:"
          find extracted \
            -maxdepth 7 \
            -type f \
            -print | head -500

      # ============================================================
      # 4. FIND GRADLE ROOT
      # ============================================================
      - name: Find Gradle Root
        id: gradle_project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FINDING GRADLE ROOT"
          echo "========================================"

          GRADLE_DIR=""

          # --------------------------------------------------------
          # Priority 1: gradlew
          # --------------------------------------------------------
          WRAPPER="$(find extracted \
            -type f \
            -name "gradlew" \
            -print -quit || true)"

          if [ -n "$WRAPPER" ]; then
            GRADLE_DIR="$(dirname "$WRAPPER")"

            echo "Found Gradle wrapper:"
            echo "$WRAPPER"
          fi

          # --------------------------------------------------------
          # Priority 2: settings.gradle
          # --------------------------------------------------------
          if [ -z "$GRADLE_DIR" ]; then

            SETTINGS="$(find extracted \
              -type f \
              \( \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
              \) \
              -print -quit || true)"

            if [ -n "$SETTINGS" ]; then
              GRADLE_DIR="$(dirname "$SETTINGS")"

              echo "Found settings file:"
              echo "$SETTINGS"
            fi
          fi

          # --------------------------------------------------------
          # Priority 3: build.gradle
          # --------------------------------------------------------
          if [ -z "$GRADLE_DIR" ]; then

            BUILD_FILE="$(find extracted \
              -type f \
              \( \
                -name "build.gradle" \
                -o -name "build.gradle.kts" \
              \) \
              -print -quit || true)"

            if [ -n "$BUILD_FILE" ]; then
              GRADLE_DIR="$(dirname "$BUILD_FILE")"

              echo "Found build file:"
              echo "$BUILD_FILE"
            fi
          fi

          # --------------------------------------------------------
          # FAIL
          # --------------------------------------------------------
          if [ -z "$GRADLE_DIR" ]; then

            echo "::error::No Gradle project found inside ZIP."

            echo ""
            echo "ZIP CONTENT:"
            find extracted \
              -maxdepth 12 \
              -type f \
              -print

            exit 1
          fi

          echo ""
          echo "========================================"
          echo "GRADLE ROOT"
          echo "========================================"

          echo "$GRADLE_DIR"

          echo "gradle_dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 6. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # 7. GRADLE
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # ============================================================
      # 8. ENVIRONMENT
      # ============================================================
      - name: Verify Environment
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Java compiler:"
          javac -version

          echo ""
          echo "Gradle:"
          gradle --version || true

          echo ""
          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-not-set}"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-not-set}"

          echo ""
          echo "SDK Manager:"
          command -v sdkmanager || true

      # ============================================================
      # 9. INSPECT PROJECT
      # ============================================================
      - name: Inspect Project
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PROJECT INSPECTION"
          echo "========================================"

          echo ""
          echo "Project root:"
          pwd

          echo ""
          echo "Gradle files:"
          find . \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) \
            -print

          echo ""
          echo "Android manifests:"
          find . \
            -type f \
            -name "AndroidManifest.xml" \
            -print

          echo ""
          echo "Gradle wrapper:"
          ls -la gradlew 2>/dev/null || true

          echo ""
          echo "Android modules:"
          find . \
            -maxdepth 4 \
            -type f \
            \( \
              -name "AndroidManifest.xml" \
            \) \
            -print

      # ============================================================
      # 10. PREPARE GRADLE WRAPPER
      # ============================================================
      - name: Prepare Gradle Wrapper
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING GRADLE"
          echo "========================================"

          if [ -f "./gradlew" ]; then

            echo "Existing Gradle wrapper found."

            chmod +x ./gradlew

          else

            echo "Gradle wrapper not found."

            echo "Generating Gradle wrapper 8.9..."

            gradle wrapper \
              --gradle-version 8.9

            chmod +x ./gradlew

          fi

          echo ""
          echo "Gradle wrapper version:"
          ./gradlew --version

      # ============================================================
      # 11. ANDROID SDK LICENSES
      # ============================================================
      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set +e

          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1
          fi

          exit 0

      # ============================================================
      # 12. BUILD DEBUG APK
      # ============================================================
      - name: Build Debug APK
        id: build_apk
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDING TEAM GOPALSINGH APK"
          echo "========================================"

          chmod +x ./gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ============================================================
      # 13. FIND APK
      # ============================================================
      - name: Find Generated APK
        id: apk
        if: success()
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING APK"
          echo "========================================"

          APK="$(find . \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)"

          if [ -z "$APK" ]; then

            echo "::error::Gradle succeeded but APK was not found."

            find . \
              -type f \
              \( \
                -name "*.apk" \
                -o -name "*.aab" \
              \) \
              -print || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          echo ""
          echo "APK SIZE:"
          du -h "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 14. PREPARE FINAL APK
      # ============================================================
      - name: Prepare Final APK
        if: success()
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/final-apk"

          mkdir -p "$GITHUB_WORKSPACE/final-apk"

          cp \
            "${{ steps.apk.outputs.apk_path }}" \
            "$GITHUB_WORKSPACE/final-apk/Team-GopalSingh-Debug.apk"

          echo "========================================"
          echo "FINAL APK"
          echo "========================================"

          ls -lh \
            "$GITHUB_WORKSPACE/final-apk/Team-GopalSingh-Debug.apk"

      # ============================================================
      # 15. UPLOAD APK
      # ============================================================
      - name: Upload Team GopalSingh APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-Debug-APK
          path: final-apk/Team-GopalSingh-Debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 16. UPLOAD BUILD LOGS IF FAILED
      # ============================================================
      - name: Collect Build Logs
        if: failure()
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD FAILURE DIAGNOSTICS"
          echo "========================================"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Gradle version:"
          ./gradlew --version || true

          echo ""
          echo "Gradle files:"
          find . \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) \
            -print

          echo ""
          echo "Android manifests:"
          find . \
            -type f \
            -name "AndroidManifest.xml" \
            -print

          echo ""
          echo "APK/AAB files:"
          find . \
            -type f \
            \( \
              -name "*.apk" \
              -o -name "*.aab" \
            \) \
            -print || true

          echo ""
          echo "Build directories:"
          find . \
            -type d \
            -name "build" \
            -print || true

      # ============================================================
      # 17. UPLOAD BUILD REPORTS
      # ============================================================
      - name: Upload Build Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-Build-Diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/**
            **/.gradle/**
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 18. SUCCESS
      # ============================================================
      - name: Build Successful
        if: success()
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "       BUILD SUCCESSFUL"
          echo "========================================"
          echo ""
          echo "APK:"
          echo "Team-GopalSingh-Debug.apk"
          echo ""
          echo "Artifact:"
          echo "Team-GopalSingh-Debug-APK"
          echo ""
          echo "GitHub:"
          echo "Actions -> Successful Run -> Artifacts"
          echo ""
          echo "========================================"
