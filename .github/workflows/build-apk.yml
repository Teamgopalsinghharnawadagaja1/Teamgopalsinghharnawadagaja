name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Jhalrapatan Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          test -d android
          test -d client

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/teamgopalsingh/app/MainActivity.kt

          test -f client/package.json
          test -f client/index.html
          test -f client/vite.config.ts

          echo "PROJECT STRUCTURE: PASSED"

      - name: Install client dependencies
        working-directory: client
        run: |
          npm install --no-audit --no-fund

      - name: TypeScript check
        working-directory: client
        run: |
          npm run lint

      - name: Build web application
        working-directory: client
        run: |
          npm run build

      - name: Verify web build
        shell: bash
        run: |
          set -euo pipefail

          test -s client/dist/index.html

          echo "WEB BUILD: PASSED"

      - name: Verify Gradle
        run: |
          gradle --version

      - name: Verify Android project
        working-directory: android
        run: |
          gradle tasks --no-daemon

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find android/app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            find android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK BUILD: PASSED"
          echo "APK: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JHALRAPATAN-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
