name: Build Team GopalSingh APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: "17"
      NODE_VERSION: "22"
      ANDROID_API: "36"
      BUILD_TOOLS: "36.0.0"
      GRADLE_VERSION: "9.3.1"

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. PREPARE DIAGNOSTICS
      # =========================================================
      - name: Prepare diagnostics
        shell: bash
        run: |
          mkdir -p build-logs
          echo "Build started at: $(date -u)" | tee build-logs/start.log

      # =========================================================
      # 3. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 4. NODE 22
      # =========================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            **/package-lock.json

      # =========================================================
      # 5. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      # =========================================================
      # 6. SETUP GRADLE
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # =========================================================
      # 7. INSPECT ROOT
      # =========================================================
      - name: Inspect repository
        shell: bash
        run: |
          set +e

          {
            echo "========================================"
            echo "REPOSITORY ROOT"
            echo "========================================"

            pwd
            echo

            find . -maxdepth 3 -type f | sort

            echo
            echo "========================================"
            echo "ROOT DIRECTORIES"
            echo "========================================"

            find . -maxdepth 2 -type d | sort

          } 2>&1 | tee build-logs/repository-structure.log

      # =========================================================
      # 8. EXTRACT PROJECT ZIP AUTOMATICALLY
      # =========================================================
      - name: Extract project archive
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          echo "Searching for ZIP archives..."

          find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            -print \
            | tee build-logs/zip-files.log

          ZIP_FILE=""

          # Prefer the known project archive.
          if [ -f "./team-gopal-singh-merged-app-android.zip" ]; then
            ZIP_FILE="./team-gopal-singh-merged-app-android.zip"
          else
            ZIP_FILE=$(find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              | head -n 1)
          fi

          if [ -n "$ZIP_FILE" ]; then

            echo "========================================"
            echo "PROJECT ZIP FOUND"
            echo "========================================"

            echo "$ZIP_FILE"

            unzip -q "$ZIP_FILE" -d extracted

            echo
            echo "Extracted files:"
            find extracted -maxdepth 5 -type f | sort | head -500

          else

            echo "No ZIP found."
            echo "Checking repository directly..."

          fi

      # =========================================================
      # 9. DETECT ANDROID + CLIENT DIRECTORIES
      # =========================================================
      - name: Detect project directories
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "========================================"

          ANDROID_SETTINGS=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ANDROID_SETTINGS" ]; then
            echo "::error::Android Gradle project not found. No settings.gradle or settings.gradle.kts found."
            echo
            echo "Repository structure:"
            find . -maxdepth 6 -type f | sort
            exit 1
          fi

          ANDROID_DIR=$(dirname "$ANDROID_SETTINGS")

          echo "Android project:"
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "SEARCHING FOR CLIENT PROJECT"
          echo "========================================"

          CLIENT_PACKAGE=$(find . \
            -type f \
            -name "package.json" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -n "$CLIENT_PACKAGE" ]; then
            CLIENT_DIR=$(dirname "$CLIENT_PACKAGE")

            echo "Client project:"
            echo "$CLIENT_DIR"

            echo "CLIENT_DIR=$CLIENT_DIR" >> "$GITHUB_ENV"
          else
            echo "No client package.json found."
            echo "CLIENT_DIR=" >> "$GITHUB_ENV"
          fi

          echo
          echo "========================================"
          echo "DETECTED PROJECT"
          echo "========================================"

          echo "ANDROID_DIR=$ANDROID_DIR"
          echo "CLIENT_DIR=${CLIENT_DIR:-NONE}"

      # =========================================================
      # 10. VERIFY ANDROID PROJECT
      # =========================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "Android directory:"
          echo "$ANDROID_DIR"

          test -d "$ANDROID_DIR"

          test -f "$ANDROID_DIR/settings.gradle" \
            || test -f "$ANDROID_DIR/settings.gradle.kts"

          test -f "$ANDROID_DIR/build.gradle" \
            || test -f "$ANDROID_DIR/build.gradle.kts"

          test -f "$ANDROID_DIR/app/build.gradle" \
            || test -f "$ANDROID_DIR/app/build.gradle.kts"

          echo
          echo "Android project verified successfully."

          echo
          echo "Android files:"
          find "$ANDROID_DIR" -maxdepth 4 -type f | sort \
            | tee build-logs/android-project-files.log

      # =========================================================
      # 11. VERIFY CLIENT
      # =========================================================
      - name: Verify client project
        if: env.CLIENT_DIR != ''
        shell: bash
        run: |
          set -e

          echo "Client directory:"
          echo "$CLIENT_DIR"

          test -f "$CLIENT_DIR/package.json"

          echo
          echo "package.json:"
          cat "$CLIENT_DIR/package.json"

          echo
          echo "Client project verified."

      # =========================================================
      # 12. INSTALL WEB DEPENDENCIES
      # =========================================================
      - name: Install web dependencies
        if: env.CLIENT_DIR != ''
        working-directory: ${{ env.CLIENT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          mkdir -p "$GITHUB_WORKSPACE/build-logs"

          echo "Installing web dependencies..."

          if [ -f package-lock.json ]; then
            npm ci 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/npm-install.log"
          else
            npm install 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/npm-install.log"
          fi

      # =========================================================
      # 13. BUILD WEB CLIENT
      # =========================================================
      - name: Build web client
        if: env.CLIENT_DIR != ''
        working-directory: ${{ env.CLIENT_DIR }}
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDING WEB CLIENT"
          echo "========================================"

          npm run build \
            2>&1 | tee "$GITHUB_WORKSPACE/build-logs/npm-build.log"

          echo
          echo "========================================"
          echo "WEB BUILD OUTPUT"
          echo "========================================"

          if [ -d dist ]; then
            find dist -maxdepth 5 -type f | sort \
              | tee "$GITHUB_WORKSPACE/build-logs/web-dist-files.log"
          else
            echo "::error::npm build completed but dist directory was not found."
            exit 1
          fi

      # =========================================================
      # 14. PREPARE ANDROID WEB ASSETS
      # =========================================================
      - name: Prepare Android web assets
        if: env.CLIENT_DIR != ''
        shell: bash
        run: |
          set -e

          WEB_ASSETS="$ANDROID_DIR/app/src/main/assets/www"

          echo "Preparing:"
          echo "$WEB_ASSETS"

          rm -rf "$WEB_ASSETS"
          mkdir -p "$WEB_ASSETS"

          cp -a "$CLIENT_DIR/dist/." "$WEB_ASSETS/"

          echo
          echo "Android web assets:"
          find "$WEB_ASSETS" -maxdepth 5 -type f | sort \
            | tee build-logs/android-assets.log

      # =========================================================
      # 15. CREATE DEBUG KEYSTORE IF NEEDED
      # =========================================================
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="$ANDROID_DIR/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then

            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              2>&1 | tee build-logs/keystore.log

          else

            echo "Existing debug.keystore found."

          fi

      # =========================================================
      # 16. DETECT GRADLE WRAPPER
      # =========================================================
      - name: Detect Gradle
        shell: bash
        run: |
          set -e

          if [ -f "$ANDROID_DIR/gradlew" ]; then

            chmod +x "$ANDROID_DIR/gradlew"

            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"

            echo "Gradle wrapper detected."

          else

            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"

            echo "No Gradle wrapper found."
            echo "Using installed Gradle."

          fi

      # =========================================================
      # 17. GRADLE PROJECT CHECK
      # =========================================================
      - name: Check Gradle project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -o pipefail

          $GRADLE_CMD tasks \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-logs/gradle-tasks.log"

      # =========================================================
      # 18. GRADLE CLEAN
      # =========================================================
      - name: Clean Android project
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -o pipefail

          $GRADLE_CMD clean \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-logs/gradle-clean.log"

      # =========================================================
      # 19. BUILD APK
      # =========================================================
      - name: Build Debug APK
        id: apk_build
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "STARTING APK BUILD"
          echo "========================================"

          $GRADLE_CMD :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-logs/gradle-build.log"

          EXIT_CODE=${PIPESTATUS[0]}

          echo "$EXIT_CODE" \
            > "$GITHUB_WORKSPACE/build-logs/gradle-exit-code.txt"

          echo
          echo "Gradle exit code: $EXIT_CODE"

          exit "$EXIT_CODE"

      # =========================================================
      # 20. LOCATE APK
      # =========================================================
      - name: Locate APK
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p apk-output

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -print \
            | tee build-logs/apk-files-found.log

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            # Fallback: find any debug APK.
            APK=$(find "$ANDROID_DIR" \
              -type f \
              -name "*debug*.apk" \
              | head -n 1)

          fi

          if [ -n "$APK" ]; then

            echo "========================================"
            echo "APK FOUND"
            echo "========================================"

            echo "$APK"

            cp "$APK" \
              apk-output/Team-GopalSingh-debug.apk

            ls -lh \
              apk-output/Team-GopalSingh-debug.apk

          else

            echo "::warning::No APK was generated."

          fi

      # =========================================================
      # 21. GENERATE EXACT ERROR SUMMARY
      # =========================================================
      - name: Generate exact error summary
        if: always()
        shell: bash
        run: |
          set +e

          SUMMARY="build-logs/exact-error-summary.txt"

          {
            echo "================================================="
            echo "TEAM GOPAL SINGH APK BUILD DIAGNOSTICS"
            echo "================================================="
            echo

            echo "DATE:"
            date -u
            echo

            echo "ANDROID_DIR:"
            echo "${ANDROID_DIR:-NOT SET}"
            echo

            echo "CLIENT_DIR:"
            echo "${CLIENT_DIR:-NOT SET}"
            echo

            echo "================================================="
            echo "GRADLE EXIT CODE"
            echo "================================================="

            if [ -f build-logs/gradle-exit-code.txt ]; then
              cat build-logs/gradle-exit-code.txt
            else
              echo "Gradle build did not start."
            fi

            echo
            echo "================================================="
            echo "IMPORTANT ERRORS"
            echo "================================================="

            for LOG in \
              build-logs/npm-install.log \
              build-logs/npm-build.log \
              build-logs/gradle-tasks.log \
              build-logs/gradle-clean.log \
              build-logs/gradle-build.log
            do

              if [ -f "$LOG" ]; then

                echo
                echo "--------------- $LOG ---------------"

                grep -n -E \
                  "FAILURE:|What went wrong:|Execution failed for task|Caused by:|AAPT2|Manifest merger failed|error:|ERROR|Exception|npm ERR!|Could not find|not found|No such file" \
                  "$LOG" \
                  | tail -150

              fi

            done

            echo
            echo "================================================="
            echo "LAST 300 GRADLE LOG LINES"
            echo "================================================="

            if [ -f build-logs/gradle-build.log ]; then
              tail -300 build-logs/gradle-build.log
            fi

            echo
            echo "================================================="
            echo "APK FILES"
            echo "================================================="

            if [ -f build-logs/apk-files-found.log ]; then
              cat build-logs/apk-files-found.log
            else
              echo "No APK search log."
            fi

          } > "$SUMMARY"

          echo
          echo "========================================"
          echo "EXACT ERROR SUMMARY"
          echo "========================================"

          cat "$SUMMARY"

      # =========================================================
      # 22. UPLOAD APK
      # =========================================================
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-APK
          path: apk-output/Team-GopalSingh-debug.apk
          if-no-files-found: warn
          retention-days: 30

      # =========================================================
      # 23. UPLOAD ALL DIAGNOSTICS
      # =========================================================
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-Build-Diagnostics
          path: |
            build-logs/**
            ${{ env.ANDROID_DIR }}/**/build/reports/**
            ${{ env.ANDROID_DIR }}/**/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 30

      # =========================================================
      # 24. FINAL RESULT
      # =========================================================
      - name: Final build status
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "FINAL BUILD STATUS"
          echo "========================================"

          if [ -f apk-output/Team-GopalSingh-debug.apk ]; then

            echo
            echo "✅ APK BUILD SUCCESSFUL"
            echo
            ls -lh apk-output/Team-GopalSingh-debug.apk
            echo
            echo "Artifact:"
            echo "Team-GopalSingh-APK"

            exit 0

          fi

          echo
          echo "❌ APK BUILD FAILED"
          echo
          echo "No APK was generated."
          echo
          echo "Download:"
          echo "Team-GopalSingh-Build-Diagnostics"
          echo
          echo "Open exact-error-summary.txt for the exact error."

          exit 1
