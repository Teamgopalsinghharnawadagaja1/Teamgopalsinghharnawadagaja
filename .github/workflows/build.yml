name: Build Verify Team Gopal Singh Jhalrapatan

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.3.1"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:

  web:
    name: Web and Backend Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      app_root: ${{ steps.locate.outputs.app_root }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Locate application root
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          FOUND=""

          while IFS= read -r CLIENT_PACKAGE; do
            CANDIDATE="$(dirname "$(dirname "$CLIENT_PACKAGE")")"

            if [ -f "$CANDIDATE/server.js" ] &&
               [ -f "$CANDIDATE/package.json" ] &&
               [ -d "$CANDIDATE/android" ] &&
               [ -f "$CANDIDATE/android/app/build.gradle.kts" ]; then
              FOUND="$CANDIDATE"
              break
            fi
          done < <(find . -type f -path "*/client/package.json" -not -path "./.git/*" | sort)

          if [ -z "$FOUND" ]; then
            if [ -f package.json ] &&
               [ -f server.js ] &&
               [ -d client ] &&
               [ -d android ] &&
               [ -f android/app/build.gradle.kts ]; then
              FOUND="."
            fi
          fi

          if [ -z "$FOUND" ]; then
            echo "ERROR: Could not locate the application."
            echo "Expected package.json + server.js + client/ + android/app/build.gradle.kts."
            echo "Repository layout:"
            find . -maxdepth 4 -type f \
              \( -name package.json -o -name server.js -o -name build.gradle.kts \) \
              -print | sort
            exit 1
          fi

          FOUND="${FOUND#./}"
          [ -n "$FOUND" ] || FOUND="."

          echo "Application root: $FOUND"
          echo "app_root=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Verify application structure
        working-directory: ${{ steps.locate.outputs.app_root }}
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f server.js
          test -f client/package.json
          test -f client/index.html
          test -d android
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/teamgopalsingh/app/MainActivity.kt

          echo "Application structure verified."

      - name: Install backend dependencies
        working-directory: ${{ steps.locate.outputs.app_root }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund --legacy-peer-deps
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Install client dependencies
        working-directory: ${{ steps.locate.outputs.app_root }}/client
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund --legacy-peer-deps
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Check backend syntax
        working-directory: ${{ steps.locate.outputs.app_root }}
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js

      - name: Run client lint when available
        working-directory: ${{ steps.locate.outputs.app_root }}/client
        shell: bash
        run: |
          set -euo pipefail

          LINT="$(node -e 'const p=require("./package.json"); process.stdout.write((p.scripts&&p.scripts.lint)||"")')"

          if [ -z "$LINT" ]; then
            echo "No lint script; skipping."
          else
            npm run lint
          fi

      - name: Build web client
        working-directory: ${{ steps.locate.outputs.app_root }}/client
        shell: bash
        run: |
          set -euo pipefail

          BUILD="$(node -e 'const p=require("./package.json"); process.stdout.write((p.scripts&&p.scripts.build)||"")')"

          if [ -z "$BUILD" ]; then
            echo "ERROR: client/package.json has no build script."
            exit 1
          fi

          npm run build
          test -f dist/index.html

      - name: Verify backend startup and health
        working-directory: ${{ steps.locate.outputs.app_root }}
        shell: bash
        env:
          PORT: "3000"
          JWT_SECRET: "ci-test-secret-only"
        run: |
          set -euo pipefail

          node server.js > backend.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=false

          for i in $(seq 1 30); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "ERROR: Backend stopped before becoming ready."
              cat backend.log || true
              exit 1
            fi

            if curl -fsS http://127.0.0.1:3000/api/health > health.json 2>/dev/null; then
              READY=true
              echo "Backend health endpoint passed:"
              cat health.json
              break
            fi

            sleep 1
          done

          if [ "$READY" != "true" ]; then
            echo "ERROR: /api/health did not become available on port 3000."
            echo "Backend log:"
            cat backend.log || true
            exit 1
          fi

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: verified-web-dist
          path: ${{ steps.locate.outputs.app_root }}/client/dist
          if-no-files-found: error
          retention-days: 7


  android:
    name: Android Build and Verification
    runs-on: ubuntu-latest
    timeout-minutes: 40

    needs: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Locate application root
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          FOUND=""

          while IFS= read -r CLIENT_PACKAGE; do
            CANDIDATE="$(dirname "$(dirname "$CLIENT_PACKAGE")")"

            if [ -f "$CANDIDATE/server.js" ] &&
               [ -f "$CANDIDATE/package.json" ] &&
               [ -f "$CANDIDATE/android/app/build.gradle.kts" ]; then
              FOUND="$CANDIDATE"
              break
            fi
          done < <(find . -type f -path "*/client/package.json" -not -path "./.git/*" | sort)

          if [ -z "$FOUND" ]; then
            if [ -f package.json ] &&
               [ -f server.js ] &&
               [ -f android/app/build.gradle.kts ]; then
              FOUND="."
            fi
          fi

          if [ -z "$FOUND" ]; then
            echo "ERROR: Application root not found."
            exit 1
          fi

          FOUND="${FOUND#./}"
          [ -n "$FOUND" ] || FOUND="."

          echo "Application root: $FOUND"
          echo "app_root=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Verify Android project
        working-directory: ${{ steps.locate.outputs.app_root }}
        shell: bash
        run: |
          set -euo pipefail

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/teamgopalsingh/app/MainActivity.kt

          echo "Android project verified."

      - name: Download verified web build
        uses: actions/download-artifact@v4
        with:
          name: verified-web-dist
          path: ${{ needs.web.outputs.app_root }}/client/dist

      - name: Verify web build
        working-directory: ${{ needs.web.outputs.app_root }}
        shell: bash
        run: |
          set -euo pipefail
          test -f client/dist/index.html

      - name: Prepare Android WebView assets
        working-directory: ${{ needs.web.outputs.app_root }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets

          cp -a client/dist/. android/app/src/main/assets/

          test -f android/app/src/main/assets/index.html

          echo "Web assets copied to Android assets."

      - name: Create debug keystore
        working-directory: ${{ needs.web.outputs.app_root }}
        shell: bash
        run: |
          set -euo pipefail

          rm -f android/debug.keystore

          keytool -genkeypair -v \
            -keystore android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Preflight Android Kotlin source
        working-directory: ${{ needs.web.outputs.app_root }}
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/src/main/java/com/teamgopalsingh/app/MainActivity.kt

          echo "Checking MainActivity.kt for required WebView classes..."
          grep -q "WebViewAssetLoader" android/app/src/main/java/com/teamgopalsingh/app/MainActivity.kt
          grep -q "AssetsPathHandler" android/app/src/main/java/com/teamgopalsingh/app/MainActivity.kt

          echo "Android Kotlin source preflight passed."

      - name: Build Android debug APK
        working-directory: ${{ needs.web.outputs.app_root }}/android
        shell: bash
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug \
              --no-daemon \
              --stacktrace \
              --console=plain
          else
            gradle clean assembleDebug \
              --no-daemon \
              --stacktrace \
              --console=plain
          fi

          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-Jhalrapatan-Debug-APK
          path: ${{ needs.web.outputs.app_root }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14


  final_verify:
    name: Final Project Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs:
      - web
      - android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify final project layout
        shell: bash
        run: |
          set -euo pipefail

          FOUND=""

          while IFS= read -r CLIENT_PACKAGE; do
            CANDIDATE="$(dirname "$(dirname "$CLIENT_PACKAGE")")"

            if [ -f "$CANDIDATE/server.js" ] &&
               [ -f "$CANDIDATE/package.json" ] &&
               [ -f "$CANDIDATE/android/app/build.gradle.kts" ]; then
              FOUND="$CANDIDATE"
              break
            fi
          done < <(find . -type f -path "*/client/package.json" -not -path "./.git/*" | sort)

          if [ -z "$FOUND" ]; then
            echo "ERROR: Final application layout not found."
            exit 1
          fi

          echo "Final application root: $FOUND"
          echo "FINAL PROJECT VERIFICATION PASSED"

      - name: Final pipeline success
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "       BUILD / VERIFY PIPELINE PASSED"
          echo "=============================================="
          echo "Web + Backend : PASSED"
          echo "Android APK   : PASSED"
          echo "Project       : VERIFIED"
          echo "=============================================="
