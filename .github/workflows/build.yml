name: Build Verify Team Gopal Singh Jhalrapatan

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: japp
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.3.1"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:

  # ============================================================
  # 1. WEB + BACKEND
  # ============================================================

  web:
    name: Web and Backend Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify project layout
        shell: bash
        run: |
          set -euo pipefail

          test -d "${APP_DIR}"
          test -f "${APP_DIR}/package.json"
          test -f "${APP_DIR}/server.js"

          test -f "${APP_DIR}/client/package.json"
          test -f "${APP_DIR}/client/index.html"
          test -f "${APP_DIR}/client/vite.config.ts"
          test -f "${APP_DIR}/client/tsconfig.json"

          test -f "${APP_DIR}/android/settings.gradle.kts"
          test -f "${APP_DIR}/android/build.gradle.kts"
          test -f "${APP_DIR}/android/app/build.gradle.kts"
          test -f "${APP_DIR}/android/app/src/main/AndroidManifest.xml"
          test -f "${APP_DIR}/android/app/src/main/java/com/teamgopalsingh/app/MainActivity.kt"

          echo "======================================"
          echo "PROJECT LAYOUT VERIFIED"
          echo "======================================"
          find "${APP_DIR}" -maxdepth 2 -type f \( -name 'package.json' -o -name 'server.js' -o -name 'settings.gradle.kts' \) -print

      - name: Install backend dependencies
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install client dependencies
        working-directory: ${{ env.APP_DIR }}/client
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Check backend syntax
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          echo "Backend syntax passed."

      - name: TypeScript verification
        working-directory: ${{ env.APP_DIR }}/client
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          echo "TypeScript verification passed."

      - name: Build web client
        working-directory: ${{ env.APP_DIR }}/client
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html
          echo "Web build passed."

      - name: Verify backend health endpoint
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        env:
          PORT: "3000"
          JWT_SECRET: "ci-test-secret-only"
        run: |
          set -euo pipefail

          node server.js > backend.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=false

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > health.json; then
              READY=true
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Backend stopped unexpectedly."
              cat backend.log || true
              exit 1
            fi

            sleep 1
          done

          if [ "$READY" != "true" ]; then
            echo "Backend health endpoint did not become ready."
            cat backend.log || true
            exit 1
          fi

          grep -q '"ok":true' health.json
          echo "Backend health check passed."
          cat health.json

      - name: Upload verified web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: ${{ env.APP_DIR }}/client/dist
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # 2. ANDROID DEBUG APK
  # ============================================================

  android:
    name: Android Build and Verification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Verify Android project
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle.properties
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/teamgopalsingh/app/MainActivity.kt

          grep -q 'AssetsPathHandler(this)' \
            android/app/src/main/java/com/teamgopalsingh/app/MainActivity.kt

          echo "Android project structure verified."
          echo "MainActivity WebViewAssetLoader verified."

      - name: Download verified web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ${{ env.APP_DIR }}/client/dist

      - name: Verify downloaded web build
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f client/dist/index.html
          echo "Verified client/dist/index.html."

      - name: Prepare Android WebView assets
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -a client/dist/. android/app/src/main/assets/

          test -f android/app/src/main/assets/index.html
          echo "Android WebView assets prepared."

      - name: Create debug keystore
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          rm -f android/debug.keystore

          keytool -genkeypair -v \
            -keystore android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f android/debug.keystore

      - name: Gradle clean
        working-directory: ${{ env.APP_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail
          gradle clean --no-daemon --stacktrace --console=plain

      - name: Build Android debug APK
        working-directory: ${{ env.APP_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode all

          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "======================================"
          echo "ANDROID DEBUG APK BUILD PASSED"
          echo "======================================"

      - name: Verify generated APK
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          echo "Generated APK:"
          ls -lh "$APK"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-Jhalrapatan-Debug-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ============================================================
  # 3. FINAL VERIFICATION
  # ============================================================

  final_verify:
    name: Final Project Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - web
      - android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Final project verification
        shell: bash
        run: |
          set -euo pipefail

          test -d "${APP_DIR}"
          test -f "${APP_DIR}/package.json"
          test -f "${APP_DIR}/server.js"
          test -f "${APP_DIR}/client/package.json"
          test -f "${APP_DIR}/client/index.html"
          test -f "${APP_DIR}/client/vite.config.ts"
          test -f "${APP_DIR}/android/settings.gradle.kts"
          test -f "${APP_DIR}/android/build.gradle.kts"
          test -f "${APP_DIR}/android/app/build.gradle.kts"
          test -f "${APP_DIR}/android/app/src/main/AndroidManifest.xml"
          test -f "${APP_DIR}/android/app/src/main/java/com/teamgopalsingh/app/MainActivity.kt"

          echo "=============================================="
          echo "FINAL PROJECT STRUCTURE VERIFIED"
          echo "=============================================="
          echo "Application root : ${APP_DIR}/"
          echo "Backend          : OK"
          echo "Web client       : OK"
          echo "Android/Kotlin   : OK"
          echo "Gradle KTS       : OK"

      - name: Final pipeline success
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=============================================="
          echo "       BUILD / VERIFY PIPELINE PASSED"
          echo "=============================================="
          echo "Web + Backend : PASSED"
          echo "Android APK   : PASSED"
          echo "Project       : VERIFIED"
          echo ""
          echo "=============================================="
          echo "              PIPELINE PASSED"
          echo "=============================================="
