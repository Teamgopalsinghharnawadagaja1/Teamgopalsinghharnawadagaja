name: Build Verify Team Gopal Singh Jhalrapatan

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-gopal-singh-build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: japp
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.3.1"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:

  # ============================================================
  # 1. WEB + BACKEND
  # ============================================================

  web:
    name: Web and Backend Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify ZIP project layout
        shell: bash
        run: |
          set -euo pipefail

          test -d "${APP_DIR}"
          test -f "${APP_DIR}/package.json"
          test -f "${APP_DIR}/server.js"
          test -f "${APP_DIR}/client/package.json"
          test -f "${APP_DIR}/client/index.html"
          test -f "${APP_DIR}/client/vite.config.ts"
          test -f "${APP_DIR}/android/settings.gradle.kts"
          test -f "${APP_DIR}/android/build.gradle.kts"
          test -f "${APP_DIR}/android/app/build.gradle.kts"
          test -f "${APP_DIR}/android/app/src/main/AndroidManifest.xml"
          test -f "${APP_DIR}/android/app/src/main/java/com/teamgopalsingh/app/MainActivity.kt"

          echo "Project layout OK: ${APP_DIR}/"

      - name: Install backend dependencies
        working-directory: japp
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Install client dependencies
        working-directory: japp/client
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Check backend syntax
        working-directory: japp
        shell: bash
        run: |
          set -euo pipefail

          node --check server.js
          echo "Backend syntax passed."

      - name: TypeScript verification
        working-directory: japp/client
        shell: bash
        run: |
          set -euo pipefail

          npm run lint
          echo "TypeScript verification passed."

      - name: Build web client
        working-directory: japp/client
        shell: bash
        run: |
          set -euo pipefail

          npm run build
          test -f dist/index.html

          echo "Web build passed."

      - name: Verify backend health endpoint
        working-directory: japp
        shell: bash
        env:
          PORT: "3000"
          JWT_SECRET: "ci-test-secret-only"
        run: |
          set -euo pipefail

          node server.js > backend.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=false

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > health.json; then
              READY=true
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Backend stopped unexpectedly."
              cat backend.log || true
              exit 1
            fi

            sleep 1
          done

          if [ "$READY" != "true" ]; then
            echo "Backend health endpoint did not become ready."
            cat backend.log || true
            exit 1
          fi

          grep -q '"ok":true' health.json
          echo "Backend health check passed."
          cat health.json

      - name: Upload verified web build
        uses: actions/upload-artifact@v4
        with:
          name: team-gopal-singh-web-dist
          path: japp/client/dist
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # 2. ANDROID DEBUG APK
  # ============================================================

  android:
    name: Android Build and Verification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f "${APP_DIR}/android/settings.gradle.kts"
          test -f "${APP_DIR}/android/build.gradle.kts"
          test -f "${APP_DIR}/android/app/build.gradle.kts"
          test -f "${APP_DIR}/android/app/src/main/AndroidManifest.xml"
          test -f "${APP_DIR}/android/app/src/main/java/com/teamgopalsingh/app/MainActivity.kt"

          grep -q 'com.android.application' "${APP_DIR}/android/build.gradle.kts"
          grep -q 'version = "9.1.1"' "${APP_DIR}/android/build.gradle.kts"
          grep -q 'compileSdk = 36' "${APP_DIR}/android/app/build.gradle.kts"
          grep -q 'AssetsPathHandler(this)' "${APP_DIR}/android/app/src/main/java/com/teamgopalsingh/app/MainActivity.kt"

          echo "Android project verified."

      - name: Download verified web build
        uses: actions/download-artifact@v4
        with:
          name: team-gopal-singh-web-dist
          path: japp/client/dist

      - name: Verify downloaded web build
        shell: bash
        run: |
          set -euo pipefail

          test -f "${APP_DIR}/client/dist/index.html"
          echo "Verified client/dist/index.html."

      - name: Prepare Android WebView assets
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${APP_DIR}/android/app/src/main/assets"
          mkdir -p "${APP_DIR}/android/app/src/main/assets"

          cp -a "${APP_DIR}/client/dist/." "${APP_DIR}/android/app/src/main/assets/"

          test -f "${APP_DIR}/android/app/src/main/assets/index.html"
          echo "Android WebView assets prepared."

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail

          rm -f "${APP_DIR}/android/debug.keystore"

          keytool -genkeypair -v \
            -keystore "${APP_DIR}/android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f "${APP_DIR}/android/debug.keystore"

      - name: Gradle clean
        working-directory: japp/android
        shell: bash
        run: |
          set -euo pipefail

          gradle clean \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Build Android debug APK
        working-directory: japp/android
        shell: bash
        run: |
          set -euo pipefail

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode all

          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "Android debug APK build passed."

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${APP_DIR}/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          echo "Generated APK: $APK"
          ls -lh "$APK"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-Jhalrapatan-Debug-APK
          path: japp/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


  # ============================================================
  # 3. FINAL VERIFICATION
  # ============================================================

  final_verify:
    name: Final Project Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - web
      - android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Final project verification
        shell: bash
        run: |
          set -euo pipefail

          test -f "${APP_DIR}/package.json"
          test -f "${APP_DIR}/server.js"
          test -f "${APP_DIR}/client/package.json"
          test -f "${APP_DIR}/client/index.html"
          test -f "${APP_DIR}/client/vite.config.ts"
          test -f "${APP_DIR}/android/settings.gradle.kts"
          test -f "${APP_DIR}/android/build.gradle.kts"
          test -f "${APP_DIR}/android/app/build.gradle.kts"
          test -f "${APP_DIR}/android/app/src/main/AndroidManifest.xml"
          test -f "${APP_DIR}/android/app/src/main/java/com/teamgopalsingh/app/MainActivity.kt"

          echo "=============================================="
          echo "FINAL PROJECT STRUCTURE VERIFIED"
          echo "=============================================="
          echo "Application root : ${APP_DIR}/"
          echo "Backend          : OK"
          echo "Web client       : OK"
          echo "Android/Kotlin   : OK"
          echo "Gradle KTS       : OK"

      - name: Final pipeline success
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=============================================="
          echo "       BUILD / VERIFY PIPELINE PASSED"
          echo "=============================================="
          echo "Web + Backend : PASSED"
          echo "Android APK   : PASSED"
          echo "Project       : VERIFIED"
          echo "=============================================="
