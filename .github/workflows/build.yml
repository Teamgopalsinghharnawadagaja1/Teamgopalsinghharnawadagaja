name: Build Team GopalSingh APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  CI: "false"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 1 -type f -name "*.zip" | head -1)"

          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP..."
            unzip -o "$ZIP"
          else
            echo "No ZIP found. Using existing project files."
          fi

          echo "===== PROJECT ====="
          ls -la

          echo "===== ANDROID ====="
          ls -la android

          echo "===== CLIENT ====="
          ls -la client

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Check Android Project
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "::error::android directory not found."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "::error::android/gradlew not found."
            exit 1
          fi

          chmod +x android/gradlew

          echo "===== GRADLE WRAPPER ====="
          cd android
          ./gradlew --version

      - name: Create local.properties
        shell: bash
        run: |
          set -e

          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

          echo "===== local.properties ====="
          cat android/local.properties

      - name: Create Debug Keystore
        shell: bash
        run: |
          set -e

          if [ ! -f android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore android/debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "Debug keystore already exists."
          fi

          ls -lh android/debug.keystore

      - name: NPM Install
        working-directory: client
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: NPM Build
        working-directory: client
        shell: bash
        run: |
          set -e

          npm run build

          if [ ! -d "dist" ]; then
            echo "::error::client/dist was not created."
            exit 1
          fi

          echo "===== DIST ====="
          ls -la dist

      - name: Copy Web Assets
        shell: bash
        run: |
          set -e

          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www

          cp -r client/dist/. android/app/src/main/assets/www/

          echo "===== WEB ASSETS ====="
          find android/app/src/main/assets/www -type f | head -100

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail

          chmod +x gradlew

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain

      - name: Find APK
        id: apk
        if: success()
        working-directory: android
        shell: bash
        run: |
          set -e

          APK="$(find . -type f -name "*.apk" | head -1)"

          if [ -z "$APK" ]; then
            echo "::error::APK not found."
            exit 1
          fi

          echo "APK found: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

          du -h "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-Debug-APK
          path: android/${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-Build-Diagnostics
          path: |
            android/**/*.log
            android/**/build/reports/**
            android/**/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 7

      - name: Build Successful
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "      BUILD SUCCESSFUL"
          echo "========================================"
          echo "APK generated successfully."
