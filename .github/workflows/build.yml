name: Build Verify and Migrate App

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  GRADLE_VERSION: "9.3.1"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  web:
    name: Web and Backend Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f server.js
          test -f client/package.json
          test -f client/index.html
          test -f client/vite.config.ts
          test -f client/src/main.tsx
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/teamgopalsingh/app/MainActivity.kt

          echo "Project structure OK."

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install client dependencies
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Check backend syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          echo "Backend syntax passed."

      - name: TypeScript verification
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          echo "TypeScript verification passed."

      - name: Build web client
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail

          npm run build
          test -f dist/index.html

          echo "Web build passed."

      - name: Verify backend health endpoint
        shell: bash
        env:
          PORT: "3000"
          JWT_SECRET: "ci-test-secret-only"
        run: |
          set -euo pipefail

          node server.js > backend.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=false

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health > health.json; then
              READY=true
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Backend stopped unexpectedly."
              cat backend.log || true
              exit 1
            fi

            sleep 1
          done

          if [ "$READY" != "true" ]; then
            echo "Backend health endpoint did not become ready."
            cat backend.log || true
            exit 1
          fi

          grep -q '"ok":true' health.json
          cat health.json
          echo "Backend health check passed."

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: client/dist
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android Build and Verification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/teamgopalsingh/app/MainActivity.kt

          grep -q 'com.android.application' android/build.gradle.kts
          grep -q 'com.android.application' android/app/build.gradle.kts
          grep -q 'androidx.webkit:webkit' android/app/build.gradle.kts

          echo "Android project structure verified."

      - name: Download verified web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: client/dist

      - name: Verify downloaded web build
        shell: bash
        run: |
          set -euo pipefail
          test -f client/dist/index.html
          echo "Verified client/dist/index.html."

      - name: Prepare Android WebView assets
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets

          cp -a client/dist/. android/app/src/main/assets/

          test -f android/app/src/main/assets/index.html

          echo "Android WebView assets prepared."

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail

          rm -f android/debug.keystore

          keytool -genkeypair -v \
            -keystore android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f android/debug.keystore

      - name: Gradle clean
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          gradle clean \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Build Android debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --warning-mode all

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "Android debug APK build passed."

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/build/outputs/apk/debug/app-debug.apk

          echo "Generated APK files:"
          find android \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Team-GopalSingh-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  final_verify:
    name: Final Project Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - web
      - android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Final project verification
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f server.js
          test -f client/package.json
          test -f client/index.html
          test -f client/vite.config.ts
          test -f client/src/main.tsx
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/teamgopalsingh/app/MainActivity.kt

          echo "=============================================="
          echo "FINAL PROJECT STRUCTURE VERIFIED"
          echo "=============================================="
          echo "Backend        : OK"
          echo "Web client     : OK"
          echo "Android/Kotlin : OK"
          echo "Gradle KTS     : OK"

      - name: Basic secret scan
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude='*.lock' \
            '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,})' \
            .; then
            echo "Potential secret detected."
            exit 1
          fi

          echo "Basic secret scan passed."

      - name: Final pipeline success
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=============================================="
          echo "       BUILD / VERIFY PIPELINE PASSED"
          echo "=============================================="
          echo "Web + Backend : PASSED"
          echo "Android APK   : PASSED"
          echo "Security scan : PASSED"
          echo "Project       : VERIFIED"
          echo ""
          echo "=============================================="
          echo "              PIPELINE PASSED"
          echo "=============================================="
