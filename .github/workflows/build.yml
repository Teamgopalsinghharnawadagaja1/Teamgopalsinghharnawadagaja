name: Build Verify and Migrate App

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:

  # ============================================================
  # 1. PREPARE / MIGRATE / AUTO-REPAIR
  # ============================================================

  prepare:
    name: Prepare, Migrate and Auto-Repair
    runs-on: ubuntu-latest
    timeout-minutes: 35

    outputs:
      source_sha: ${{ steps.final_sha.outputs.source_sha }}
      migrated: ${{ steps.result.outputs.migrated }}
      repaired: ${{ steps.result.outputs.repaired }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Show repository information
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "REPOSITORY INFORMATION"
          echo "======================================"
          echo "Repository : $GITHUB_REPOSITORY"
          echo "Event      : $GITHUB_EVENT_NAME"
          echo "Branch     : ${GITHUB_REF_NAME:-unknown}"
          echo "SHA        : $GITHUB_SHA"
          echo "======================================"

          git status --short || true

      - name: Detect existing project
        shell: bash
        run: |
          set -e

          if [ \
            -f "package.json" ] &&
            [ -f "server.js" ] &&
            [ -f "client/package.json" ] &&
            [ -d "client" ] &&
            [ -d "android" ]
          then
            echo "PROJECT_EXISTS=true" >> "$GITHUB_ENV"

            echo "======================================"
            echo "PROJECT ALREADY EXISTS"
            echo "======================================"
          else
            echo "PROJECT_EXISTS=false" >> "$GITHUB_ENV"

            echo "======================================"
            echo "PROJECT ROOT INCOMPLETE"
            echo "ZIP MIGRATION MAY BE REQUIRED"
            echo "======================================"
          fi

      - name: Find and migrate application ZIP
        if: env.PROJECT_EXISTS == 'false'
        shell: bash
        run: |
          set -e

          mapfile -t ZIPS < <(
            find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              -not -path "./migration-temp/*" \
              | sort
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No application ZIP found."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "ERROR: Multiple ZIP files found:"
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIPS[0]}"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          rm -rf migration-temp
          mkdir -p migration-temp

          unzip -q "$ZIP_FILE" -d migration-temp

          echo "ZIP extraction successful."

      - name: Locate application inside ZIP
        if: env.PROJECT_EXISTS == 'false'
        shell: bash
        run: |
          set -e

          mapfile -t PROJECTS < <(
            find migration-temp \
              -type f \
              -name "package.json" \
              -print0 |
            xargs -0 -r -n1 dirname |
            while read -r DIR
            do
              if [ \
                -f "$DIR/server.js" ] &&
                [ -f "$DIR/client/package.json" ] &&
                [ -d "$DIR/client" ] &&
                [ -d "$DIR/android" ]
              then
                echo "$DIR"
              fi
            done |
            sort -u
          )

          if [ "${#PROJECTS[@]}" -eq 0 ]; then
            echo "ERROR: Complete application was not found inside ZIP."
            exit 1
          fi

          if [ "${#PROJECTS[@]}" -gt 1 ]; then
            echo "ERROR: Multiple application projects found:"
            printf '%s\n' "${PROJECTS[@]}"
            exit 1
          fi

          APP_DIR="${PROJECTS[0]}"

          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            "$APP_DIR/" \
            ./

          echo "Application migrated to repository root."

      - name: Verify project structure
        shell: bash
        run: |
          set -e

          test -f package.json
          test -f server.js
          test -f client/package.json
          test -d client
          test -d android

          echo "PROJECT STRUCTURE VERIFIED"

      - name: Safe dependency and formatting auto-repair
        shell: bash
        run: |
          set +e

          REPAIRED=false

          echo "Starting safe auto-repair..."

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund

            if [ $? -ne 0 ]; then
              rm -rf node_modules
              npm cache clean --force || true

              npm install \
                --no-audit \
                --no-fund \
                --legacy-peer-deps

              [ $? -eq 0 ] && REPAIRED=true
            fi
          else
            npm install \
              --no-audit \
              --no-fund \
              --legacy-peer-deps

            [ $? -eq 0 ] && REPAIRED=true
          fi

          if [ -f client/package-lock.json ]; then
            (
              cd client
              npm ci --no-audit --no-fund
            )

            if [ $? -ne 0 ]; then
              rm -rf client/node_modules
              npm cache clean --force || true

              (
                cd client
                npm install \
                  --no-audit \
                  --no-fund \
                  --legacy-peer-deps
              )

              [ $? -eq 0 ] && REPAIRED=true
            fi
          else
            (
              cd client
              npm install \
                --no-audit \
                --no-fund \
                --legacy-peer-deps
            )

            [ $? -eq 0 ] && REPAIRED=true
          fi

          if [ -f client/package.json ]; then

            LINT_SCRIPT=$(node -e "
              const p=require('./client/package.json');
              console.log((p.scripts && p.scripts.lint) || '');
            " 2>/dev/null)

            if echo "$LINT_SCRIPT" | grep -qi "eslint"; then
              (
                cd client
                npm run lint -- --fix
              )

              [ $? -eq 0 ] && REPAIRED=true
            fi
          fi

          rm -rf client/dist

          echo "repaired=$REPAIRED" >> "$GITHUB_ENV"

          echo "Auto-repair finished: $REPAIRED"

      - name: Remove migration files
        if: env.PROJECT_EXISTS == 'false'
        shell: bash
        run: |
          set -e

          if [ -n "${ZIP_FILE:-}" ]; then
            rm -f "$ZIP_FILE"
          fi

          rm -rf migration-temp

      - name: Commit and push migration or repair
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No migration or repair changes."
            echo "CURRENT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi

          git commit -m "Migrate and auto-repair application"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "Pull request detected. Automatic push disabled."
            echo "CURRENT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi

          BRANCH="${GITHUB_REF_NAME}"

          if [ "$BRANCH" != "main" ] && [ "$BRANCH" != "master" ]; then
            echo "Automatic push disabled for branch: $BRANCH"
            echo "CURRENT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
            exit 0
          fi

          PUSH_OK=false

          for ATTEMPT in 1 2 3
          do
            echo "PUSH ATTEMPT $ATTEMPT/3"

            git fetch origin "$BRANCH"

            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort || true

              if [ "$ATTEMPT" -eq 3 ]; then
                exit 1
              fi

              sleep 3
              continue
            fi

            if git push origin "HEAD:$BRANCH"; then
              PUSH_OK=true
              break
            fi

            sleep 3
          done

          if [ "$PUSH_OK" != "true" ]; then
            echo "ERROR: Push failed after 3 attempts."
            exit 1
          fi

          git fetch origin "$BRANCH"

          FINAL_SHA=$(git rev-parse "origin/$BRANCH")

          echo "CURRENT_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

          echo "Final SHA: $FINAL_SHA"

      - name: Set final source SHA
        id: final_sha
        shell: bash
        run: |
          set -e

          SHA="${CURRENT_SHA:-$(git rev-parse HEAD)}"

          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"

          echo "Prepared source SHA: $SHA"

      - name: Set prepare result
        id: result
        shell: bash
        run: |
          if [ "${PROJECT_EXISTS:-false}" = "false" ]; then
            echo "migrated=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrated=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "${repaired:-false}" = "true" ]; then
            echo "repaired=true" >> "$GITHUB_OUTPUT"
          else
            echo "repaired=false" >> "$GITHUB_OUTPUT"
          fi


  # ============================================================
  # 2. WEB + BACKEND
  # ============================================================

  web:
    name: Web and Backend Verification
    runs-on: ubuntu-latest
    timeout-minutes: 40

    needs:
      - prepare

    steps:

      - name: Checkout prepared source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify project files
        shell: bash
        run: |
          set -e

          test -f package.json
          test -f server.js
          test -f client/package.json
          test -d client
          test -d android

          echo "Project structure verified."

      - name: Install backend dependencies
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            if ! npm ci --no-audit --no-fund; then
              rm -rf node_modules
              npm install \
                --no-audit \
                --no-fund \
                --legacy-peer-deps
            fi
          else
            npm install \
              --no-audit \
              --no-fund \
              --legacy-peer-deps
          fi

      - name: Install client dependencies
        shell: bash
        run: |
          set -e

          if [ -f client/package-lock.json ]; then
            if ! (
              cd client
              npm ci --no-audit --no-fund
            ); then

              rm -rf client/node_modules

              (
                cd client
                npm install \
                  --no-audit \
                  --no-fund \
                  --legacy-peer-deps
              )
            fi
          else
            (
              cd client
              npm install \
                --no-audit \
                --no-fund \
                --legacy-peer-deps
            )
          fi

      - name: Check backend syntax
        shell: bash
        run: |
          set -e

          node --check server.js

          echo "Backend syntax passed."

      - name: Run client lint with auto-repair
        shell: bash
        run: |
          set +e

          cd client

          LINT_SCRIPT=$(node -e "
            const p=require('./package.json');
            console.log((p.scripts && p.scripts.lint) || '');
          " 2>/dev/null)

          if [ -z "$LINT_SCRIPT" ]; then
            echo "No lint script found."
            exit 0
          fi

          npm run lint

          LINT_STATUS=$?

          if [ "$LINT_STATUS" -ne 0 ]; then
            echo "Lint failed. Trying auto-fix..."

            npm run lint -- --fix

            FIX_STATUS=$?

            if [ "$FIX_STATUS" -ne 0 ]; then
              echo "ERROR: Client lint failed after auto-fix."
              exit "$FIX_STATUS"
            fi
          fi

          echo "Client lint passed."

      - name: Build web client
        shell: bash
        run: |
          set -e

          cd client

          BUILD_SCRIPT=$(node -e "
            const p=require('./package.json');
            console.log((p.scripts && p.scripts.build) || '');
          " 2>/dev/null)

          if [ -z "$BUILD_SCRIPT" ]; then
            echo "ERROR: No client build script found."
            exit 1
          fi

          npm run build

          echo "Client build passed."

      - name: Verify backend startup
        shell: bash
        run: |
          set -e

          node server.js > backend.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          READY=false

          for i in $(seq 1 20)
          do
            sleep 1

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "ERROR: Backend process stopped."
              cat backend.log || true
              exit 1
            fi

            if grep -Eqi \
              "listening|server started|running on|localhost|127\.0\.0\.1" \
              backend.log 2>/dev/null
            then
              READY=true
              break
            fi
          done

          if [ "$READY" != "true" ]; then
            echo "Backend startup message was not detected."
            cat backend.log || true
          fi

          echo "Backend startup check passed."

      - name: Final web verification
        shell: bash
        run: |
          set -e

          test -f package.json
          test -f server.js
          test -f client/package.json
          test -d client
          test -d android

          echo "======================================"
          echo "WEB + BACKEND VERIFICATION PASSED"
          echo "======================================"


  # ============================================================
  # 3. ANDROID BUILD / VERIFICATION
  # ============================================================

  android:
    name: Android Build and Verification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    needs:
      - prepare

    steps:

      - name: Checkout prepared source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -d android
          test -f android/gradlew

          chmod +x android/gradlew

          echo "Android project verified."

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Android clean
        working-directory: android
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build Android debug APK
        working-directory: android
        shell: bash
        run: |
          set -e

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

          echo "ANDROID DEBUG BUILD PASSED"

      - name: Verify generated APK
        shell: bash
        run: |
          set -e

          APK_COUNT=$(find android \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          echo "Generated APK files:"

          find android \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Final Android verification
        shell: bash
        run: |
          set -e

          APK_COUNT=$(find android \
            -type f \
            -name "*.apk" \
            | wc -l)

          test "$APK_COUNT" -gt 0

          echo "======================================"
          echo "ANDROID VERIFICATION PASSED"
          echo "======================================"


  # ============================================================
  # 4. FINAL VERIFICATION
  # ============================================================

  final_verify:
    name: Final Project Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs:
      - prepare
      - web
      - android

    steps:

      - name: Checkout final prepared source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Final project verification
        shell: bash
        run: |
          set -e

          test -f package.json
          test -f server.js
          test -f client/package.json
          test -d client
          test -d android
          test -f android/gradlew

          echo ""
          echo "======================================"
          echo "FINAL PROJECT STRUCTURE VERIFIED"
          echo "======================================"

          echo "package.json        : OK"
          echo "server.js           : OK"
          echo "client/package.json : OK"
          echo "client/             : OK"
          echo "android/            : OK"
          echo "android/gradlew     : OK"

      - name: Final pipeline success
        shell: bash
        run: |
          set -e

          echo ""
          echo "=============================================="
          echo "       BUILD / VERIFY / MIGRATE PASSED"
          echo "=============================================="

          echo ""
          echo "Migration     : ${{ needs.prepare.outputs.migrated }}"
          echo "Auto-repair   : ${{ needs.prepare.outputs.repaired }}"
          echo "Source SHA    : ${{ needs.prepare.outputs.source_sha }}"

          echo ""
          echo "Web + Backend : PASSED"
          echo "Android       : PASSED"
          echo "Project       : VERIFIED"

          echo ""
          echo "=============================================="
          echo "             PIPELINE PASSED"
          echo "=============================================="
