name: Migrate App From ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    name: Extract and Migrate App
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # =========================================================
      # 2. FIND EXACTLY ONE ZIP
      # =========================================================
      - name: Find application ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for application ZIP..."

          mapfile -t ZIPS < <(
            find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              | sort
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP file found in repository."
            echo ""
            echo "Files currently in repository:"
            find . -maxdepth 3 -type f \
              -not -path "./.git/*" \
              | sort
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "ERROR: Multiple ZIP files found."
            echo ""
            printf '%s\n' "${ZIPS[@]}"
            echo ""
            echo "Keep only the application ZIP and run again."
            exit 1
          fi

          ZIP_FILE="${ZIPS[0]}"

          echo "Application ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # =========================================================
      # 3. PREPARE TEMP DIRECTORY
      # =========================================================
      - name: Prepare migration workspace
        shell: bash
        run: |
          set -e

          rm -rf migration-temp
          rm -rf migration-backup

          mkdir -p migration-temp
          mkdir -p migration-backup

          echo "Migration workspace ready."


      # =========================================================
      # 4. EXTRACT ZIP
      # =========================================================
      - name: Extract application ZIP
        shell: bash
        run: |
          set -e

          unzip -q "$ZIP_FILE" -d migration-temp

          echo "ZIP extracted successfully."

          echo ""
          echo "Extracted directories:"
          find migration-temp \
            -maxdepth 3 \
            -type d \
            | sort \
            | head -100


      # =========================================================
      # 5. LOCATE ACTUAL APP PROJECT
      # =========================================================
      - name: Locate application project
        shell: bash
        run: |
          set -e

          echo "Searching for application project..."

          mapfile -t PROJECTS < <(
            find migration-temp \
              -type f \
              -name "package.json" \
              -print0 |
            xargs -0 -r -n1 dirname |
            while read -r DIR; do
              if [ -f "$DIR/server.js" ] &&
                 [ -f "$DIR/client/package.json" ] &&
                 [ -d "$DIR/client" ] &&
                 [ -d "$DIR/android" ]; then
                echo "$DIR"
              fi
            done |
            sort -u
          )

          if [ "${#PROJECTS[@]}" -eq 0 ]; then
            echo "ERROR: Complete application project was not found."
            echo ""
            echo "Expected structure:"
            echo "package.json"
            echo "server.js"
            echo "client/package.json"
            echo "android/"
            echo ""
            echo "Found package.json files:"
            find migration-temp \
              -type f \
              -name "package.json" \
              | sort
            exit 1
          fi

          if [ "${#PROJECTS[@]}" -gt 1 ]; then
            echo "ERROR: Multiple possible application projects found:"
            printf '%s\n' "${PROJECTS[@]}"
            exit 1
          fi

          APP_DIR="${PROJECTS[0]}"

          echo "Application project found:"
          echo "$APP_DIR"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 6. VERIFY APPLICATION
      # =========================================================
      - name: Verify application structure
        shell: bash
        run: |
          set -e

          echo "Verifying application..."

          test -f "$APP_DIR/package.json"
          test -f "$APP_DIR/server.js"
          test -f "$APP_DIR/client/package.json"
          test -d "$APP_DIR/client"
          test -d "$APP_DIR/android"

          echo ""
          echo "======================================"
          echo "APPLICATION STRUCTURE VERIFIED"
          echo "======================================"
          echo "Root package.json    : OK"
          echo "server.js            : OK"
          echo "client/              : OK"
          echo "client/package.json  : OK"
          echo "android/             : OK"
          echo "======================================"


      # =========================================================
      # 7. BACKUP EXISTING GITHUB WORKFLOWS
      # =========================================================
      - name: Preserve existing workflows
        shell: bash
        run: |
          set -e

          if [ -d ".github/workflows" ]; then
            cp -R ".github/workflows/." "migration-backup/"
          fi

          echo "Existing workflows preserved."


      # =========================================================
      # 8. COPY APPLICATION TO ROOT
      # =========================================================
      - name: Migrate application to repository root
        shell: bash
        run: |
          set -e

          echo "Copying application files..."

          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            "$APP_DIR/" \
            ./

          echo "Application copied to repository root."


      # =========================================================
      # 9. RESTORE WORKFLOWS
      # =========================================================
      - name: Restore GitHub workflows
        shell: bash
        run: |
          set -e

          mkdir -p .github/workflows

          if [ -d "migration-backup" ]; then
            cp -R migration-backup/. .github/workflows/
          fi

          echo "GitHub workflows restored."


      # =========================================================
      # 10. VERIFY FINAL ROOT
      # =========================================================
      - name: Verify final repository structure
        shell: bash
        run: |
          set -e

          echo ""
          echo "Checking final repository structure..."
          echo ""

          test -f package.json || {
            echo "ERROR: package.json missing."
            exit 1
          }

          test -f server.js || {
            echo "ERROR: server.js missing."
            exit 1
          }

          test -f client/package.json || {
            echo "ERROR: client/package.json missing."
            exit 1
          }

          test -d client || {
            echo "ERROR: client directory missing."
            exit 1
          }

          test -d android || {
            echo "ERROR: android directory missing."
            exit 1
          }

          echo "======================================"
          echo "FINAL STRUCTURE VERIFIED"
          echo "======================================"
          echo "package.json        : OK"
          echo "server.js           : OK"
          echo "client/             : OK"
          echo "client/package.json : OK"
          echo "android/            : OK"
          echo "======================================"


      # =========================================================
      # 11. REMOVE ZIP
      # =========================================================
      - name: Remove old ZIP
        shell: bash
        run: |
          set -e

          rm -f "$ZIP_FILE"

          echo "Old ZIP removed."


      # =========================================================
      # 12. CLEAN TEMP FILES
      # =========================================================
      - name: Cleanup migration files
        shell: bash
        run: |
          set -e

          rm -rf migration-temp
          rm -rf migration-backup

          echo "Temporary migration files removed."


      # =========================================================
      # 13. FINAL CHECK BEFORE COMMIT
      # =========================================================
      - name: Final pre-commit verification
        shell: bash
        run: |
          set -e

          test -f package.json
          test -f server.js
          test -f client/package.json
          test -d client
          test -d android

          echo ""
          echo "======================================"
          echo "PRE-COMMIT VERIFICATION PASSED"
          echo "======================================"


      # =========================================================
      # 14. COMMIT AND PUSH
      # =========================================================
      - name: Commit migrated application
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            echo "Migration may already be complete."
            exit 0
          fi

          git commit -m "Migrate application project to repository root"

          git push

          echo ""
          echo "======================================"
          echo "MIGRATION COMPLETE"
          echo "======================================"
          echo "Application is now at repository root."
          echo "======================================"
