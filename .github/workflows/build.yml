name: Build and Verify

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true


jobs:

  # ============================================================
  # WEB BUILD
  # ============================================================
  web:
    name: Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify package files
        shell: bash
        run: |
          set -e

          test -f package.json || {
            echo "ERROR: package.json not found"
            exit 1
          }

          test -f package-lock.json || {
            echo "ERROR: package-lock.json not found"
            echo "Run npm install locally and commit package-lock.json"
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Check backend syntax
        run: node --check server.js

      - name: Build web
        run: npm run build

      - name: Verify web build
        shell: bash
        run: |
          set -e

          test -d dist || {
            echo "ERROR: dist directory missing"
            exit 1
          }

          test -f dist/index.html || {
            echo "ERROR: dist/index.html missing"
            exit 1
          }

          echo "WEB BUILD OK"

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error


  # ============================================================
  # BACKEND
  # ============================================================
  backend:
    name: Backend Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify package files
        shell: bash
        run: |
          test -f package.json
          test -f package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server.js

      - name: Run lint if available
        run: npm run lint --if-present

      - name: Run tests if available
        run: npm run test --if-present


  # ============================================================
  # ANDROID
  # ============================================================
  android:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - web

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -d android || {
            echo "ERROR: android directory missing"
            exit 1
          }

          test -f android/gradlew || {
            echo "ERROR: android/gradlew missing"
            exit 1
          }

          mkdir -p android/app/src/main/assets/www

      - name: Copy web build to Android
        shell: bash
        run: |
          set -e

          rm -rf android/app/src/main/assets/www/*
          cp -R dist/. android/app/src/main/assets/www/

          test -f android/app/src/main/assets/www/index.html

          echo "ANDROID WEB ASSETS OK"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Run Android tests
        working-directory: android
        run: ./gradlew test --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK CREATED:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


  # ============================================================
  # SECURITY
  # ============================================================
  security:
    name: Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check obvious secrets
        shell: bash
        run: |
          set -e

          FOUND=0

          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude='*.lock' \
            --exclude='*.map' \
            --exclude='*.png' \
            --exclude='*.jpg' \
            --exclude='*.jpeg' \
            --exclude='*.webp' \
            '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,})' \
            .; then

            FOUND=1
          fi

          if [ "$FOUND" -eq 1 ]; then
            echo "ERROR: Possible secret detected"
            exit 1
          fi

          echo "SECURITY CHECK OK"


  # ============================================================
  # VERIFICATION POLICY
  # ============================================================
  verification:
    name: Verification Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check prohibited verification claims
        shell: bash
        run: |
          set -e

          if grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            "100% Verified" \
            .; then

            echo "ERROR: '100% Verified' claim found"
            echo "Use: Verified / Verification Pending / Rejected"
            exit 1
          fi

          if grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            "100% सत्य" \
            .; then

            echo "ERROR: '100% सत्य' claim found"
            exit 1
          fi

          echo "VERIFICATION POLICY OK"


  # ============================================================
  # FINAL
  # ============================================================
  final:
    name: Final Status
    runs-on: ubuntu-latest

    needs:
      - web
      - backend
      - android
      - security
      - verification

    if: always()

    steps:

      - name: Verify all jobs
        shell: bash
        run: |
          set -e

          echo "Web: ${{ needs.web.result }}"
          echo "Backend: ${{ needs.backend.result }}"
          echo "Android: ${{ needs.android.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Verification: ${{ needs.verification.result }}"

          test "${{ needs.web.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.android.result }}" = "success"
          test "${{ needs.security.result }}" = "success"
          test "${{ needs.verification.result }}" = "success"

          echo ""
          echo "======================================"
          echo "ALL CHECKS PASSED"
          echo "======================================"
