          test -f package.json
          test -f server.js

          test -f client/package.json
          test -d client

          test -d android

          echo "Root package.json : OK"
          echo "server.js         : OK"
          echo "client/           : OK"
          echo "android/          : OK"

          echo ""
          echo "======================================"
