name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Structure Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f server.js
          test -f client/package.json
          test -f client/index.html
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -d .github/workflows
          echo "Structure verification PASSED."

  web:
    name: Web PWA Build
    runs-on: ubuntu-latest
    needs: structure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package.json

      - name: Install Web dependencies
        working-directory: client
        run: npm install

      - name: Lint Web
        working-directory: client
        run: npm run lint --if-present

      - name: Build Web
        working-directory: client
        run: npm run build

      - name: Verify Web output
        shell: bash
        run: |
          set -euo pipefail
          test -f client/dist/index.html
          echo "Web build verification PASSED."

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-pwa-build
          path: client/dist/**
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android Debug APK
    runs-on: ubuntu-latest
    needs: structure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Create debug keystore
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair               -v               -keystore debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-provider: basic

      - name: Show Gradle version
        run: gradle --version

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android -type f -path "*/build/outputs/apk/*/*.apk" | head -n 1)"
          test -n "$apk"
          echo "APK created: $apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - structure
      - web
      - android
    steps:
      - name: Final verification
        run: |
          echo "Structure: PASSED"
          echo "Web/PWA: PASSED"
          echo "Android APK: PASSED"
          echo "FINAL CI: PASSED"
