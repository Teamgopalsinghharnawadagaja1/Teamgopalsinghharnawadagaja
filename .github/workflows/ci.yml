name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Final Structure Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "package.json"
            "package-lock.json"
            "server.js"
            "client/index.html"
            "android/settings.gradle.kts"
            "android/app/build.gradle.kts"
          )

          for file in "${required[@]}"; do
            if [ ! -e "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done

          echo "Structure verification PASSED."

  web:
    name: Web / PWA Build
    runs-on: ubuntu-latest
    needs: structure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build Web / PWA
        run: npm run build

      - name: Verify Web output
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "dist" ]; then
            echo "dist/ found."
          elif [ -d "build" ]; then
            echo "build/ found."
          elif [ -d "out" ]; then
            echo "out/ found."
          else
            echo "::error::No Web build output found."
            exit 1
          fi

      - name: Upload Web artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-pwa-build
          path: |
            dist/**
            build/**
            out/**
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android Debug APK
    runs-on: ubuntu-latest
    needs: structure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Select Gradle
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
            echo "Using repository Gradle Wrapper."
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
            echo "No Gradle Wrapper found; using runner Gradle."
          fi

      - name: Show Gradle version
        working-directory: android
        run: "$GRADLE_CMD" --version

      - name: Build Debug APK
        working-directory: android
        run: |
          "$GRADLE_CMD" assembleDebug             --no-daemon             --stacktrace             --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          apk="$(find android -type f -name '*.apk' | head -n 1)"

          if [ -z "$apk" ]; then
            echo "::error::Android build finished without producing an APK."
            exit 1
          fi

          echo "APK found: $apk"

      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - structure
      - web
      - android

    steps:
      - name: All CI checks passed
        run: |
          echo "======================================"
          echo "FINAL CI VERIFICATION: PASSED"
          echo "Web / PWA: PASSED"
          echo "Android APK: PASSED"
          echo "Structure: PASSED"
          echo "======================================"
