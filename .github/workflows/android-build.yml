name: Team Gopal Singh Jhalrapatan - Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Prepare project from ZIP if needed
        shell: bash
        run: |
          set -e
          if [ ! -f pubspec.yaml ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1 || true)"
            if [ -n "$ZIP_FILE" ]; then
              mkdir -p .project_extract
              unzip -oq "$ZIP_FILE" -d .project_extract
              if [ -f ".project_extract/pubspec.yaml" ]; then
                cp -a .project_extract/. .
              else
                FOUND="$(find .project_extract -type f -name pubspec.yaml -print -quit || true)"
                test -n "$FOUND"
                cp -a "$(dirname "$FOUND")"/. .
              fi
            fi
          fi

      - name: Create Android platform if missing
        shell: bash
        run: |
          set -e
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            flutter create --platforms=android --org com.teamgopalsingh --project-name jhalrapatan .
          fi

      - name: Remove Flutter default test
        run: rm -f test/widget_test.dart

      - name: Verify project files
        shell: bash
        run: |
          set -e
          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f assets/requirements/feature_registry.json
          test -f lib/main.dart

      - name: Configure Firebase if secret exists
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/app
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test test/app_test.dart

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: team-gopal-singh-jhalrapatan-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
