name: Team Gopal Singh Jhalrapatan - Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter
        run: |
          flutter --version
          dart --version

      - name: Prepare Flutter project from ZIP
        shell: bash
        run: |
          set -e

          if [ ! -f pubspec.yaml ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1 || true)"

            if [ -n "$ZIP_FILE" ]; then
              echo "Found ZIP: $ZIP_FILE"

              mkdir -p .project_extract
              unzip -oq "$ZIP_FILE" -d .project_extract

              FOUND="$(find .project_extract -type f -name pubspec.yaml -print -quit || true)"

              if [ -n "$FOUND" ]; then
                PROJECT_DIR="$(dirname "$FOUND")"
                echo "Flutter project found at: $PROJECT_DIR"
                cp -a "$PROJECT_DIR"/. .
              else
                echo "ERROR: pubspec.yaml was not found inside ZIP."
                exit 1
              fi
            fi
          fi

      - name: Create Android platform if missing
        shell: bash
        run: |
          set -e

          if [ ! -f android/settings.gradle ] &&
             [ ! -f android/settings.gradle.kts ]; then

            echo "Android platform missing. Creating it..."

            flutter create \
              --platforms=android \
              --org com.teamgopalsingh \
              --project-name jhalrapatan \
              .
          fi

      - name: Verify Flutter project
        shell: bash
        run: |
          set -e

          test -f pubspec.yaml
          test -d lib
          test -f lib/main.dart
          test -d android

          echo "Flutter project verified."

      - name: Check feature registry
        shell: bash
        run: |
          if [ -f assets/requirements/feature_registry.json ]; then
            echo "Feature registry found."
          else
            echo "WARNING: feature_registry.json not found."
          fi

      - name: Configure Firebase
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/app

            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" \
              > android/app/google-services.json

            echo "Firebase configuration installed."
          else
            echo "Firebase secret not configured. Continuing without Firebase."
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Check outdated dependencies
        run: flutter pub outdated || true

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        shell: bash
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "No Flutter tests found. Skipping tests."
          fi

      - name: Build Debug APK
        run: |
          flutter build apk --debug

      - name: Rename Debug APK
        run: |
          mkdir -p release-apks

          cp build/app/outputs/flutter-apk/app-debug.apk \
            release-apks/Team-Gopal-Singh-Jhalrapatan-debug.apk

      - name: Build Release APK
        run: |
          flutter build apk --release

      - name: Rename Release APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            release-apks/Team-Gopal-Singh-Jhalrapatan-release.apk

      - name: Show APK files
        run: |
          ls -lh release-apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Team-Gopal-Singh-Jhalrapatan-APK
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 30
